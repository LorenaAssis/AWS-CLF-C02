<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 400" role="img"><title>Como o AWS CloudTrail registra uma ação</title><desc>Um usuário apaga um bucket por uma chamada de API. O CloudTrail grava o evento com quem, o quê, recurso, quando, de onde e como. A auditoria consulta o registro e descobre quem apagou.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="400"/>
<g class="c-gray"><rect x="40" y="30" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="120" y="48" text-anchor="middle" dominant-baseline="central">Usuário joao.dev</text><text class="ts" x="120" y="68" text-anchor="middle" dominant-baseline="central">Console, CLI ou SDK</text></g>
<line x1="200" y1="58" x2="258" y2="58" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="260" y="30" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Chamada de API</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">DeleteBucket</text></g>
<line x1="420" y1="58" x2="478" y2="58" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="480" y="30" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="48" text-anchor="middle" dominant-baseline="central">AWS CloudTrail</text><text class="ts" x="560" y="68" text-anchor="middle" dominant-baseline="central">Grava cada chamada</text></g>
<line x1="560" y1="86" x2="560" y2="122" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="260" y="124" width="380" height="232" rx="12" stroke-width="0.5"/><text class="th" x="450" y="148" text-anchor="middle" dominant-baseline="central">Registro do evento</text>
<text class="th" x="284" y="184" dominant-baseline="central">Quem</text><text class="ts" x="372" y="184" dominant-baseline="central">joao.dev (usuário IAM)</text>
<text class="th" x="284" y="214" dominant-baseline="central">O quê</text><text class="ts" x="372" y="214" dominant-baseline="central">DeleteBucket</text>
<text class="th" x="284" y="244" dominant-baseline="central">Recurso</text><text class="ts" x="372" y="244" dominant-baseline="central">contracheques-2026</text>
<text class="th" x="284" y="274" dominant-baseline="central">Quando</text><text class="ts" x="372" y="274" dominant-baseline="central">19/11/2026, 14:32</text>
<text class="th" x="284" y="304" dominant-baseline="central">De onde</text><text class="ts" x="372" y="304" dominant-baseline="central">IP 203.0.113.10</text>
<text class="th" x="284" y="334" dominant-baseline="central">Como</text><text class="ts" x="372" y="334" dominant-baseline="central">Console, navegador Chrome</text></g>
<line x1="258" y1="208" x2="202" y2="208" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="40" y="180" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="120" y="198" text-anchor="middle" dominant-baseline="central">Auditoria</text><text class="ts" x="120" y="218" text-anchor="middle" dominant-baseline="central">Foi o joao.dev</text></g>
</svg>
