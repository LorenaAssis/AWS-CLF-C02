<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 300" role="img"><title>S3, EBS e EFS: objeto, bloco e arquivo</title><desc>O app da loja envia uma foto para o bucket do S3, que guarda objetos. A EC2 joao-web usa um volume EBS como disco, na mesma AZ. Duas EC2 Linux montam juntas o mesmo EFS, como uma pasta de rede.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#E6F1FB}.c-blue .ts{fill:#85B7EB}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="300"/>
<g class="c-teal"><rect x="20" y="16" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="120" y="34" text-anchor="middle" dominant-baseline="central">S3: objeto</text><text class="ts" x="120" y="54" text-anchor="middle" dominant-baseline="central">guarda-volumes por URL</text></g>
<g class="c-amber"><rect x="240" y="16" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">EBS: bloco</text><text class="ts" x="340" y="54" text-anchor="middle" dominant-baseline="central">o disco de uma EC2</text></g>
<g class="c-blue"><rect x="460" y="16" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="34" text-anchor="middle" dominant-baseline="central">EFS: arquivo</text><text class="ts" x="560" y="54" text-anchor="middle" dominant-baseline="central">pasta de rede compartilhada</text></g>
<g class="c-gray"><rect x="20" y="100" width="200" height="52" rx="8" stroke-width="0.5"/><text class="th" x="120" y="118" text-anchor="middle" dominant-baseline="central">App da loja</text><text class="ts" x="120" y="138" text-anchor="middle" dominant-baseline="central">envia foto-123.jpg</text></g>
<g class="c-gray"><rect x="240" y="100" width="200" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="118" text-anchor="middle" dominant-baseline="central">EC2 joao-web</text><text class="ts" x="340" y="138" text-anchor="middle" dominant-baseline="central">Windows no volume C:</text></g>
<g class="c-gray"><rect x="460" y="100" width="90" height="52" rx="8" stroke-width="0.5"/><text class="th" x="505" y="118" text-anchor="middle" dominant-baseline="central">EC2 A</text><text class="ts" x="505" y="138" text-anchor="middle" dominant-baseline="central">Linux</text></g>
<g class="c-gray"><rect x="570" y="100" width="90" height="52" rx="8" stroke-width="0.5"/><text class="th" x="615" y="118" text-anchor="middle" dominant-baseline="central">EC2 B</text><text class="ts" x="615" y="138" text-anchor="middle" dominant-baseline="central">Linux</text></g>
<line x1="120" y1="152" x2="120" y2="184" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="152" x2="340" y2="184" class="arr" marker-end="url(#arrow)"/>
<line x1="505" y1="152" x2="530" y2="184" class="arr" marker-end="url(#arrow)"/>
<line x1="615" y1="152" x2="590" y2="184" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="20" y="186" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="120" y="204" text-anchor="middle" dominant-baseline="central">Bucket fotos-loja</text><text class="ts" x="120" y="224" text-anchor="middle" dominant-baseline="central">objeto + chave</text></g>
<g class="c-amber"><rect x="240" y="186" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="204" text-anchor="middle" dominant-baseline="central">Volume EBS 100 GB</text><text class="ts" x="340" y="224" text-anchor="middle" dominant-baseline="central">mesma AZ da EC2</text></g>
<g class="c-blue"><rect x="460" y="186" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="204" text-anchor="middle" dominant-baseline="central">EFS /relatorios</text><text class="ts" x="560" y="224" text-anchor="middle" dominant-baseline="central">as duas montam juntas</text></g>
<text class="ts" x="20" y="266" dominant-baseline="central">não vira disco C:</text>
<text class="ts" x="20" y="284" dominant-baseline="central">acesso por API ou URL</text>
<text class="ts" x="240" y="266" dominant-baseline="central">persiste se a EC2 parar</text>
<text class="ts" x="240" y="284" dominant-baseline="central">instance store: temporário</text>
<text class="ts" x="460" y="266" dominant-baseline="central">Linux (NFS), várias AZs</text>
<text class="ts" x="460" y="284" dominant-baseline="central">Windows (SMB)? use FSx</text>
</svg>
