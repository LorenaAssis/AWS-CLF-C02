<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 384" role="img"><title>Qual serviço de IA ou analytics para cada necessidade</title><desc>À esquerda, necessidades de IA e o serviço pronto: ligação vira texto (Transcribe), texto vira voz (Polly), rosto na foto (Rekognition), chatbot (Lex), busca nos manuais (Kendra) e modelo próprio (SageMaker IA). À direita, analytics: SQL no S3 (Athena), ETL (Glue), tempo real (Kinesis), painel (QuickSight), data warehouse (Redshift) e Spark (EMR).</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#EEEDFE}.c-purple .ts{fill:#AFA9EC}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="384"/>
<text class="th" x="20" y="22" dominant-baseline="central">IA pronta: só chamar a API</text>
<text class="th" x="350" y="22" dominant-baseline="central">Analytics: dados da loja</text>
<text class="ts" x="20" y="64" dominant-baseline="central">Ligação vira texto</text>
<line x1="178" y1="64" x2="198" y2="64" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="44" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="265" y="64" text-anchor="middle" dominant-baseline="central">Transcribe</text></g>
<text class="ts" x="20" y="116" dominant-baseline="central">Texto vira voz</text>
<line x1="178" y1="116" x2="198" y2="116" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="96" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="265" y="116" text-anchor="middle" dominant-baseline="central">Polly</text></g>
<text class="ts" x="20" y="168" dominant-baseline="central">Achar rosto na foto</text>
<line x1="178" y1="168" x2="198" y2="168" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="148" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="265" y="168" text-anchor="middle" dominant-baseline="central">Rekognition</text></g>
<text class="ts" x="20" y="220" dominant-baseline="central">Chatbot no site</text>
<line x1="178" y1="220" x2="198" y2="220" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="200" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="265" y="220" text-anchor="middle" dominant-baseline="central">Lex</text></g>
<text class="ts" x="20" y="272" dominant-baseline="central">Busca nos manuais</text>
<line x1="178" y1="272" x2="198" y2="272" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="252" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="265" y="272" text-anchor="middle" dominant-baseline="central">Kendra</text></g>
<text class="ts" x="20" y="324" dominant-baseline="central">Treinar modelo próprio</text>
<line x1="178" y1="324" x2="198" y2="324" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="200" y="304" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="265" y="324" text-anchor="middle" dominant-baseline="central">SageMaker IA</text></g>
<text class="ts" x="350" y="64" dominant-baseline="central">SQL nos arquivos do S3</text>
<line x1="506" y1="64" x2="528" y2="64" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="530" y="44" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="595" y="64" text-anchor="middle" dominant-baseline="central">Athena</text></g>
<text class="ts" x="350" y="116" dominant-baseline="central">Preparar dados (ETL)</text>
<line x1="506" y1="116" x2="528" y2="116" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="530" y="96" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="595" y="116" text-anchor="middle" dominant-baseline="central">Glue</text></g>
<text class="ts" x="350" y="168" dominant-baseline="central">Cliques em tempo real</text>
<line x1="506" y1="168" x2="528" y2="168" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="530" y="148" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="595" y="168" text-anchor="middle" dominant-baseline="central">Kinesis</text></g>
<text class="ts" x="350" y="220" dominant-baseline="central">Painel da diretoria</text>
<line x1="506" y1="220" x2="528" y2="220" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="530" y="200" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="595" y="220" text-anchor="middle" dominant-baseline="central">QuickSight</text></g>
<text class="ts" x="350" y="272" dominant-baseline="central">Data warehouse</text>
<line x1="506" y1="272" x2="528" y2="272" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="530" y="252" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="595" y="272" text-anchor="middle" dominant-baseline="central">Redshift</text></g>
<text class="ts" x="350" y="324" dominant-baseline="central">Spark e Hadoop</text>
<line x1="506" y1="324" x2="528" y2="324" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="530" y="304" width="130" height="40" rx="8" stroke-width="0.5"/><text class="th" x="595" y="324" text-anchor="middle" dominant-baseline="central">EMR</text></g>
<text class="ts" x="20" y="368" dominant-baseline="central">Pronto = só chamar. SageMaker IA = você treina o seu modelo.</text>
</svg>
