<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 420" role="img"><title>VPC com sub-rede pública e privada, NACL e security group</title><desc>Um cliente e um atacante chegam pelo internet gateway. A NACL da sub-rede pública nega o IP do atacante; o cliente passa e o security group da instância libera a porta 443. O banco RDS fica na sub-rede privada e só sai para a internet pelo NAT gateway.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#E6F1FB}.c-blue .ts{fill:#85B7EB}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="420"/>
<g class="c-gray"><rect x="20" y="16" width="210" height="52" rx="8" stroke-width="0.5"/><text class="th" x="125" y="34" text-anchor="middle" dominant-baseline="central">Cliente 203.0.113.10</text><text class="ts" x="125" y="54" text-anchor="middle" dominant-baseline="central">quer abrir o site</text></g>
<g class="c-teal"><rect x="260" y="16" width="160" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">Internet gateway</text><text class="ts" x="340" y="54" text-anchor="middle" dominant-baseline="central">porta da VPC</text></g>
<g class="c-gray"><rect x="450" y="16" width="210" height="52" rx="8" stroke-width="0.5"/><text class="th" x="555" y="34" text-anchor="middle" dominant-baseline="central">Atacante 198.51.100.7</text><text class="ts" x="555" y="54" text-anchor="middle" dominant-baseline="central">tenta entrar</text></g>
<line x1="230" y1="42" x2="258" y2="42" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="42" x2="422" y2="42" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="20" y="84" width="640" height="322" rx="12" stroke-width="0.5"/><text class="th" x="36" y="102" dominant-baseline="central">VPC 10.0.0.0/16</text><text class="ts" x="176" y="102" dominant-baseline="central">rede isolada, só sua</text></g>
<g class="c-teal"><rect x="36" y="118" width="350" height="274" rx="10" stroke-width="0.5"/><text class="th" x="52" y="136" dominant-baseline="central">Sub-rede pública</text><text class="ts" x="52" y="154" dominant-baseline="central">tem rota para o internet gateway</text></g>
<line x1="340" y1="68" x2="340" y2="170" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="52" y="172" width="318" height="50" rx="8" stroke-width="0.5"/><text class="th" x="211" y="188" text-anchor="middle" dominant-baseline="central">NACL: porteiro da sub-rede</text><text class="ts" x="211" y="208" text-anchor="middle" dominant-baseline="central">stateless; regra nega 198.51.100.7</text></g>
<line x1="145" y1="222" x2="145" y2="244" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="155" y="233" dominant-baseline="central">cliente passa</text>
<g class="c-amber"><rect x="52" y="246" width="190" height="130" rx="8" stroke-width="0.5"/><text class="th" x="147" y="264" text-anchor="middle" dominant-baseline="central">Security group</text><text class="ts" x="147" y="282" text-anchor="middle" dominant-baseline="central">stateful; libera porta 443</text></g>
<g class="c-gray"><rect x="68" y="300" width="158" height="60" rx="8" stroke-width="0.5"/><text class="th" x="147" y="320" text-anchor="middle" dominant-baseline="central">EC2 do site</text><text class="ts" x="147" y="340" text-anchor="middle" dominant-baseline="central">resposta já liberada</text></g>
<g class="c-gray"><rect x="258" y="300" width="112" height="60" rx="8" stroke-width="0.5"/><text class="th" x="314" y="320" text-anchor="middle" dominant-baseline="central">NAT gateway</text><text class="ts" x="314" y="340" text-anchor="middle" dominant-baseline="central">só saída</text></g>
<g class="c-blue"><rect x="402" y="118" width="242" height="274" rx="10" stroke-width="0.5"/><text class="th" x="418" y="136" dominant-baseline="central">Sub-rede privada</text><text class="ts" x="418" y="154" dominant-baseline="central">sem rota da internet</text>
<text class="ts" x="418" y="200" dominant-baseline="central">O banco sai pelo NAT para</text>
<text class="ts" x="418" y="218" dominant-baseline="central">baixar atualização; de fora,</text>
<text class="ts" x="418" y="236" dominant-baseline="central">ninguém inicia conexão.</text></g>
<g class="c-gray"><rect x="418" y="300" width="210" height="60" rx="8" stroke-width="0.5"/><text class="th" x="523" y="320" text-anchor="middle" dominant-baseline="central">RDS banco da loja</text><text class="ts" x="523" y="340" text-anchor="middle" dominant-baseline="central">nenhum IP público</text></g>
<line x1="416" y1="330" x2="372" y2="330" class="arr" marker-end="url(#arrow)"/>
</svg>
