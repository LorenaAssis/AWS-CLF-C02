<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 400" role="img"><title>Responsabilidade compartilhada no EC2, RDS e Lambda</title><desc>Três colunas lado a lado. Em cada serviço, a parte azul é do cliente (segurança na nuvem) e a parte laranja é da AWS (segurança da nuvem). No EC2 o cliente cuida até do sistema operacional; no RDS a AWS assume o sistema e o banco; no Lambda o cliente cuida só do código, dos dados e das permissões.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#E6F1FB}.c-blue .ts{fill:#E6F1FB}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="400"/>
<text class="th" x="130" y="34" text-anchor="middle" dominant-baseline="central">Amazon EC2</text>
<text class="ts" x="130" y="56" text-anchor="middle" dominant-baseline="central">Você administra a máquina</text>
<text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">Amazon RDS</text>
<text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">Banco gerenciado</text>
<text class="th" x="550" y="34" text-anchor="middle" dominant-baseline="central">AWS Lambda</text>
<text class="ts" x="550" y="56" text-anchor="middle" dominant-baseline="central">Sem servidor</text>
<g class="c-blue"><rect x="40" y="80" width="180" height="150" rx="8" stroke-width="0.5"/><text class="th" x="130" y="104" text-anchor="middle" dominant-baseline="central">Cliente (na nuvem)</text><text class="ts" x="130" y="128" text-anchor="middle" dominant-baseline="central">Dados e permissões</text><text class="ts" x="130" y="150" text-anchor="middle" dominant-baseline="central">Aplicação</text><text class="ts" x="130" y="172" text-anchor="middle" dominant-baseline="central">Security group</text><text class="ts" x="130" y="194" text-anchor="middle" dominant-baseline="central">SO convidado e patches</text></g>
<g class="c-amber"><rect x="40" y="240" width="180" height="90" rx="8" stroke-width="0.5"/><text class="th" x="130" y="262" text-anchor="middle" dominant-baseline="central">AWS (da nuvem)</text><text class="ts" x="130" y="286" text-anchor="middle" dominant-baseline="central">Virtualização</text><text class="ts" x="130" y="308" text-anchor="middle" dominant-baseline="central">Hardware e datacenter</text></g>
<g class="c-blue"><rect x="250" y="80" width="180" height="105" rx="8" stroke-width="0.5"/><text class="th" x="340" y="104" text-anchor="middle" dominant-baseline="central">Cliente (na nuvem)</text><text class="ts" x="340" y="128" text-anchor="middle" dominant-baseline="central">Dados e permissões</text><text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">Usuários do banco</text><text class="ts" x="340" y="172" text-anchor="middle" dominant-baseline="central">Security group</text></g>
<g class="c-amber"><rect x="250" y="195" width="180" height="135" rx="8" stroke-width="0.5"/><text class="th" x="340" y="217" text-anchor="middle" dominant-baseline="central">AWS (da nuvem)</text><text class="ts" x="340" y="241" text-anchor="middle" dominant-baseline="central">SO e patches</text><text class="ts" x="340" y="263" text-anchor="middle" dominant-baseline="central">Mecanismo do banco</text><text class="ts" x="340" y="285" text-anchor="middle" dominant-baseline="central">Hardware e datacenter</text></g>
<g class="c-blue"><rect x="460" y="80" width="180" height="80" rx="8" stroke-width="0.5"/><text class="th" x="550" y="104" text-anchor="middle" dominant-baseline="central">Cliente (na nuvem)</text><text class="ts" x="550" y="126" text-anchor="middle" dominant-baseline="central">Seu código</text><text class="ts" x="550" y="146" text-anchor="middle" dominant-baseline="central">Dados e permissões</text></g>
<g class="c-amber"><rect x="460" y="170" width="180" height="160" rx="8" stroke-width="0.5"/><text class="th" x="550" y="192" text-anchor="middle" dominant-baseline="central">AWS (da nuvem)</text><text class="ts" x="550" y="216" text-anchor="middle" dominant-baseline="central">SO e runtime</text><text class="ts" x="550" y="238" text-anchor="middle" dominant-baseline="central">Escala e disponibilidade</text><text class="ts" x="550" y="260" text-anchor="middle" dominant-baseline="central">Hardware e datacenter</text></g>
<line x1="60" y1="354" x2="618" y2="354" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="378" text-anchor="middle" dominant-baseline="central">Quanto mais gerenciado o serviço, mais a AWS assume</text>
</svg>
