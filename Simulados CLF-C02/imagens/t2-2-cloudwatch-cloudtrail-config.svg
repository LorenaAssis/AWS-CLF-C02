<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 400" role="img"><title>CloudWatch, CloudTrail e Config na mesma instância</title><desc>Uma instância EC2 da loja online observada por três serviços. O CloudWatch, como o painel do carro, vê a CPU em 92 por cento e dispara um alarme que avisa por e-mail via SNS. O CloudTrail, como a câmera, registra que joao.dev abriu a porta 22. O Config, como o checklist de inspeção, compara o padrão com a realidade e marca o recurso como não conforme.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#E6F1FB}.c-blue .ts{fill:#E6F1FB}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="400"/>
<g class="c-gray"><rect x="240" y="20" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Instância EC2 web-01</text><text class="ts" x="340" y="58" text-anchor="middle" dominant-baseline="central">Loja online em produção</text></g>
<line x1="290" y1="76" x2="140" y2="124" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="76" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>
<line x1="390" y1="76" x2="540" y2="124" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="30" y="126" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="125" y="146" text-anchor="middle" dominant-baseline="central">Amazon CloudWatch</text><text class="ts" x="125" y="168" text-anchor="middle" dominant-baseline="central">Como ela está?</text><text class="ts" x="125" y="186" text-anchor="middle" dominant-baseline="central">Painel do carro</text></g>
<g class="c-teal"><rect x="245" y="126" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="340" y="146" text-anchor="middle" dominant-baseline="central">AWS CloudTrail</text><text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">Quem mexeu nela?</text><text class="ts" x="340" y="186" text-anchor="middle" dominant-baseline="central">Câmera de segurança</text></g>
<g class="c-amber"><rect x="460" y="126" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="555" y="146" text-anchor="middle" dominant-baseline="central">AWS Config</text><text class="ts" x="555" y="168" text-anchor="middle" dominant-baseline="central">Está no padrão?</text><text class="ts" x="555" y="186" text-anchor="middle" dominant-baseline="central">Checklist de inspeção</text></g>
<line x1="125" y1="198" x2="125" y2="228" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="198" x2="340" y2="228" class="arr" marker-end="url(#arrow)"/>
<line x1="555" y1="198" x2="555" y2="228" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="30" y="230" width="190" height="124" rx="8" stroke-width="0.5"/><text class="th" x="125" y="252" text-anchor="middle" dominant-baseline="central">Métrica e alarme</text><text class="ts" x="125" y="276" text-anchor="middle" dominant-baseline="central">CPU em 92% por 10 min</text><text class="ts" x="125" y="298" text-anchor="middle" dominant-baseline="central">Estado: em alarme</text><text class="ts" x="125" y="320" text-anchor="middle" dominant-baseline="central">SNS manda e-mail</text><text class="ts" x="125" y="340" text-anchor="middle" dominant-baseline="central">ao time de plantão</text></g>
<g class="c-teal"><rect x="245" y="230" width="190" height="124" rx="8" stroke-width="0.5"/><text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">Registro da ação</text><text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central">Quem: joao.dev</text><text class="ts" x="340" y="298" text-anchor="middle" dominant-baseline="central">O quê: abriu a porta 22</text><text class="ts" x="340" y="320" text-anchor="middle" dominant-baseline="central">Quando: 19/11, 14:32</text><text class="ts" x="340" y="340" text-anchor="middle" dominant-baseline="central">De onde: 203.0.113.10</text></g>
<g class="c-amber"><rect x="460" y="230" width="190" height="124" rx="8" stroke-width="0.5"/><text class="th" x="555" y="252" text-anchor="middle" dominant-baseline="central">Padrão x realidade</text><text class="ts" x="555" y="276" text-anchor="middle" dominant-baseline="central">Padrão: só porta 443</text><text class="ts" x="555" y="298" text-anchor="middle" dominant-baseline="central">Real: porta 22 aberta</text><text class="ts" x="555" y="320" text-anchor="middle" dominant-baseline="central">Resultado: não conforme</text><text class="ts" x="555" y="340" text-anchor="middle" dominant-baseline="central">Histórico da mudança</text></g>
<text class="th" x="125" y="380" text-anchor="middle" dominant-baseline="central">Desempenho</text>
<text class="th" x="340" y="380" text-anchor="middle" dominant-baseline="central">Quem fez o quê</text>
<text class="th" x="555" y="380" text-anchor="middle" dominant-baseline="central">Configuração</text>
</svg>
