<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 340" role="img"><title>Auto Scaling e balanceador na Black Friday</title><desc>Clientes no pico da Black Friday chegam ao balanceador de carga (ELB), que divide o tráfego entre as instâncias. O Auto Scaling aumenta de 2 para 6 instâncias EC2 no pico, volta a 2 na madrugada e substitui as que falham.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="340"/>
<g class="c-gray"><rect x="20" y="150" width="170" height="60" rx="8" stroke-width="0.5"/><text class="th" x="105" y="170" text-anchor="middle" dominant-baseline="central">Clientes</text><text class="ts" x="105" y="192" text-anchor="middle" dominant-baseline="central">pico na Black Friday</text></g>
<line x1="190" y1="180" x2="218" y2="180" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="220" y="130" width="150" height="100" rx="8" stroke-width="0.5"/><text class="th" x="295" y="150" text-anchor="middle" dominant-baseline="central">ELB</text><text class="ts" x="295" y="170" text-anchor="middle" dominant-baseline="central">balanceador de carga</text><text class="ts" x="295" y="190" text-anchor="middle" dominant-baseline="central">divide o tráfego</text><text class="ts" x="295" y="208" text-anchor="middle" dominant-baseline="central">entre as instâncias</text></g>
<g class="c-amber"><rect x="400" y="20" width="260" height="300" rx="12" stroke-width="0.5"/><text class="th" x="530" y="42" text-anchor="middle" dominant-baseline="central">Auto Scaling</text><text class="ts" x="530" y="62" text-anchor="middle" dominant-baseline="central">aumenta ou diminui a</text><text class="ts" x="530" y="80" text-anchor="middle" dominant-baseline="central">quantidade de instâncias</text><text class="ts" x="530" y="252" text-anchor="middle" dominant-baseline="central">tracejadas: criadas no pico</text><text class="ts" x="530" y="272" text-anchor="middle" dominant-baseline="central">na madrugada, volta a 2</text><text class="ts" x="530" y="292" text-anchor="middle" dominant-baseline="central">e substitui as que falham</text></g>
<g class="c-gray"><rect x="420" y="100" width="100" height="36" rx="6" stroke-width="0.5"/><text class="th" x="470" y="118" text-anchor="middle" dominant-baseline="central">EC2 1</text></g>
<g class="c-gray"><rect x="540" y="100" width="100" height="36" rx="6" stroke-width="0.5"/><text class="th" x="590" y="118" text-anchor="middle" dominant-baseline="central">EC2 2</text></g>
<g class="c-gray"><rect x="420" y="146" width="100" height="36" rx="6" stroke-width="1" stroke-dasharray="4 3"/><text class="th" x="470" y="164" text-anchor="middle" dominant-baseline="central">EC2 3</text></g>
<g class="c-gray"><rect x="540" y="146" width="100" height="36" rx="6" stroke-width="1" stroke-dasharray="4 3"/><text class="th" x="590" y="164" text-anchor="middle" dominant-baseline="central">EC2 4</text></g>
<g class="c-gray"><rect x="420" y="192" width="100" height="36" rx="6" stroke-width="1" stroke-dasharray="4 3"/><text class="th" x="470" y="210" text-anchor="middle" dominant-baseline="central">EC2 5</text></g>
<g class="c-gray"><rect x="540" y="192" width="100" height="36" rx="6" stroke-width="1" stroke-dasharray="4 3"/><text class="th" x="590" y="210" text-anchor="middle" dominant-baseline="central">EC2 6</text></g>
<line x1="370" y1="165" x2="418" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="370" y1="180" x2="418" y2="164" class="arr" marker-end="url(#arrow)"/>
<line x1="370" y1="195" x2="418" y2="208" class="arr" marker-end="url(#arrow)"/>
<text class="t" x="195" y="268" text-anchor="middle" dominant-baseline="central">ELB: divide o tráfego</text>
<text class="t" x="195" y="292" text-anchor="middle" dominant-baseline="central">Auto Scaling: muda a quantidade</text>
</svg>
