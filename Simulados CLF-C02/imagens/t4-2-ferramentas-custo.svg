<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 310" role="img"><title>Calculadora, Budgets e Cost Explorer: antes, durante e depois</title><desc>Projeto app-entregas. Antes de criar, a Calculadora de preços estima 480 dólares por mês. Durante o mês, o Budgets tem limite de 500 dólares e manda e-mail ao atingir 80%. Depois, o Cost Explorer mostra que o EC2 foi 70% da conta e prevê o próximo mês. Tags de alocação ativadas no Billing separam o custo do projeto e o CUR entrega o relatório mais detalhado em um bucket S3.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t{fill:#F1EFE8}.ts{fill:#D3D1C7}.th{fill:#F1EFE8}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="310"/>
<text class="th" x="114" y="40" text-anchor="middle" dominant-baseline="central">Antes: estimar</text>
<text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">Durante: alertar</text>
<text class="th" x="566" y="40" text-anchor="middle" dominant-baseline="central">Depois: analisar</text>
<g class="c-gray"><rect x="16" y="60" width="196" height="120" rx="8" stroke-width="0.5"/><text class="th" x="114" y="84" text-anchor="middle" dominant-baseline="central">Calculadora de preços</text><text class="ts" x="114" y="112" text-anchor="middle" dominant-baseline="central">Estima antes de criar</text><text class="ts" x="114" y="134" text-anchor="middle" dominant-baseline="central">Projeto app-entregas</text><text class="ts" x="114" y="156" text-anchor="middle" dominant-baseline="central">previsto: US$ 480/mês</text></g>
<line x1="212" y1="120" x2="240" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="242" y="60" width="196" height="120" rx="8" stroke-width="0.5"/><text class="th" x="340" y="84" text-anchor="middle" dominant-baseline="central">AWS Budgets</text><text class="ts" x="340" y="112" text-anchor="middle" dominant-baseline="central">Limite: US$ 500/mês</text><text class="ts" x="340" y="134" text-anchor="middle" dominant-baseline="central">Gasto chegou a US$ 400</text><text class="ts" x="340" y="156" text-anchor="middle" dominant-baseline="central">E-mail: atingiu 80%</text></g>
<line x1="438" y1="120" x2="466" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="468" y="60" width="196" height="120" rx="8" stroke-width="0.5"/><text class="th" x="566" y="84" text-anchor="middle" dominant-baseline="central">AWS Cost Explorer</text><text class="ts" x="566" y="112" text-anchor="middle" dominant-baseline="central">Analisa o que já gastou</text><text class="ts" x="566" y="134" text-anchor="middle" dominant-baseline="central">EC2 foi 70% da conta</text><text class="ts" x="566" y="156" text-anchor="middle" dominant-baseline="central">E prevê o próximo mês</text></g>
<line x1="566" y1="210" x2="566" y2="183" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="16" y="210" width="648" height="80" rx="8" stroke-width="0.5"/><text class="th" x="340" y="232" text-anchor="middle" dominant-baseline="central">Tags de alocação de custos e CUR</text><text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">Tag projeto=app-entregas, ativada no Billing, separa o custo do projeto</text><text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central">CUR: o relatório mais detalhado, entregue em um bucket S3</text></g>
</svg>
