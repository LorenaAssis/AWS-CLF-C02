<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 380" role="img"><title>Três bancos numa loja online</title><desc>Um cliente compra um tênis no app da loja. Os pedidos e pagamentos ficam no RDS ou Aurora (relacional, SQL, tabelas ligadas). O carrinho e a sessão ficam no DynamoDB (NoSQL chave-valor). A vitrine mais vista fica no ElastiCache (cache em memória), que responde em microssegundos e alivia o banco.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#E6F1FB}.c-blue .ts{fill:#85B7EB}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="380"/>
<g class="c-gray"><rect x="30" y="20" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="120" y="40" text-anchor="middle" dominant-baseline="central">Cliente</text><text class="ts" x="120" y="60" text-anchor="middle" dominant-baseline="central">compra um tênis</text></g>
<line x1="210" y1="48" x2="248" y2="48" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="250" y="20" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">App da loja</text><text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">site de vendas</text></g>
<line x1="300" y1="76" x2="120" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="76" x2="340" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="76" x2="560" y2="128" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="20" y="130" width="200" height="110" rx="8" stroke-width="0.5"/><text class="th" x="120" y="150" text-anchor="middle" dominant-baseline="central">RDS ou Aurora</text><text class="ts" x="120" y="172" text-anchor="middle" dominant-baseline="central">relacional (SQL)</text><text class="ts" x="120" y="192" text-anchor="middle" dominant-baseline="central">pedidos e pagamentos</text><text class="ts" x="120" y="212" text-anchor="middle" dominant-baseline="central">tabelas ligadas</text></g>
<g class="c-teal"><rect x="240" y="130" width="200" height="110" rx="8" stroke-width="0.5"/><text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">DynamoDB</text><text class="ts" x="340" y="172" text-anchor="middle" dominant-baseline="central">NoSQL chave-valor</text><text class="ts" x="340" y="192" text-anchor="middle" dominant-baseline="central">carrinho e sessão</text><text class="ts" x="340" y="212" text-anchor="middle" dominant-baseline="central">escala enorme</text></g>
<g class="c-amber"><rect x="460" y="130" width="200" height="110" rx="8" stroke-width="0.5"/><text class="th" x="560" y="150" text-anchor="middle" dominant-baseline="central">ElastiCache</text><text class="ts" x="560" y="172" text-anchor="middle" dominant-baseline="central">cache em memória</text><text class="ts" x="560" y="192" text-anchor="middle" dominant-baseline="central">vitrine mais vista</text><text class="ts" x="560" y="212" text-anchor="middle" dominant-baseline="central">alivia o banco</text></g>
<line x1="120" y1="240" x2="120" y2="268" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="240" x2="340" y2="268" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="240" x2="560" y2="268" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="20" y="270" width="200" height="56" rx="8" stroke-width="0.5"/><text class="ts" x="120" y="290" text-anchor="middle" dominant-baseline="central">pedido 1042, cliente 77</text><text class="ts" x="120" y="308" text-anchor="middle" dominant-baseline="central">junta com a tabela clientes</text></g>
<g class="c-teal"><rect x="240" y="270" width="200" height="56" rx="8" stroke-width="0.5"/><text class="ts" x="340" y="290" text-anchor="middle" dominant-baseline="central">chave: carrinho#ana</text><text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">valor: tênis, meia</text></g>
<g class="c-amber"><rect x="460" y="270" width="200" height="56" rx="8" stroke-width="0.5"/><text class="ts" x="560" y="290" text-anchor="middle" dominant-baseline="central">chave: top10-home</text><text class="ts" x="560" y="308" text-anchor="middle" dominant-baseline="central">resposta em microssegundos</text></g>
<text class="ts" x="340" y="356" text-anchor="middle" dominant-baseline="central">Cada dado no banco certo: transação, escala ou velocidade</text>
</svg>
