<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 376" role="img"><title>AWS CAF: 6 perspectivas e 4 resultados</title><desc>O AWS Cloud Adoption Framework organiza a adoção da nuvem em 3 perspectivas de negócio (Negócios, Pessoas, Governança) e 3 técnicas (Plataforma, Segurança, Operações). Juntas elas levam aos 4 resultados de negócio: menos risco, ESG melhor, mais receita e mais eficiência operacional.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#EEEDFE}.c-purple .ts{fill:#EEEDFE}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="376"/>
<g class="c-teal"><rect x="40" y="16" width="290" height="202" rx="12" stroke-width="0.5"/><text class="th" x="185" y="36" text-anchor="middle" dominant-baseline="central">Perspectivas de negócio</text></g>
<g class="c-teal"><rect x="56" y="56" width="258" height="44" rx="8" stroke-width="0.5"/><text class="th" x="185" y="70" text-anchor="middle" dominant-baseline="central">Negócios</text><text class="ts" x="185" y="88" text-anchor="middle" dominant-baseline="central">Estratégia, inovação, portfólio</text></g>
<g class="c-teal"><rect x="56" y="108" width="258" height="44" rx="8" stroke-width="0.5"/><text class="th" x="185" y="122" text-anchor="middle" dominant-baseline="central">Pessoas</text><text class="ts" x="185" y="140" text-anchor="middle" dominant-baseline="central">Cultura, treinamento, liderança</text></g>
<g class="c-teal"><rect x="56" y="160" width="258" height="44" rx="8" stroke-width="0.5"/><text class="th" x="185" y="174" text-anchor="middle" dominant-baseline="central">Governança</text><text class="ts" x="185" y="192" text-anchor="middle" dominant-baseline="central">Riscos, custos, projetos</text></g>
<g class="c-purple"><rect x="350" y="16" width="290" height="202" rx="12" stroke-width="0.5"/><text class="th" x="495" y="36" text-anchor="middle" dominant-baseline="central">Perspectivas técnicas</text></g>
<g class="c-purple"><rect x="366" y="56" width="258" height="44" rx="8" stroke-width="0.5"/><text class="th" x="495" y="70" text-anchor="middle" dominant-baseline="central">Plataforma</text><text class="ts" x="495" y="88" text-anchor="middle" dominant-baseline="central">Arquitetura, engenharia, CI/CD</text></g>
<g class="c-purple"><rect x="366" y="108" width="258" height="44" rx="8" stroke-width="0.5"/><text class="th" x="495" y="122" text-anchor="middle" dominant-baseline="central">Segurança</text><text class="ts" x="495" y="140" text-anchor="middle" dominant-baseline="central">Identidade, dados, incidentes</text></g>
<g class="c-purple"><rect x="366" y="160" width="258" height="44" rx="8" stroke-width="0.5"/><text class="th" x="495" y="174" text-anchor="middle" dominant-baseline="central">Operações</text><text class="ts" x="495" y="192" text-anchor="middle" dominant-baseline="central">Monitorar, mudanças, patches</text></g>
<line x1="185" y1="218" x2="185" y2="250" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="218" x2="495" y2="250" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="40" y="252" width="600" height="108" rx="12" stroke-width="0.5"/><text class="th" x="340" y="272" text-anchor="middle" dominant-baseline="central">4 resultados de negócio</text>
<text class="th" x="115" y="300" text-anchor="middle" dominant-baseline="central">Menos risco</text><text class="ts" x="115" y="320" text-anchor="middle" dominant-baseline="central">do negócio e</text><text class="ts" x="115" y="338" text-anchor="middle" dominant-baseline="central">de conformidade</text>
<text class="th" x="265" y="300" text-anchor="middle" dominant-baseline="central">ESG melhor</text><text class="ts" x="265" y="320" text-anchor="middle" dominant-baseline="central">ambiental, social</text><text class="ts" x="265" y="338" text-anchor="middle" dominant-baseline="central">e governança</text>
<text class="th" x="415" y="300" text-anchor="middle" dominant-baseline="central">Mais receita</text><text class="ts" x="415" y="320" text-anchor="middle" dominant-baseline="central">produtos novos</text><text class="ts" x="415" y="338" text-anchor="middle" dominant-baseline="central">mais rápido</text>
<text class="th" x="565" y="300" text-anchor="middle" dominant-baseline="central">Mais eficiência</text><text class="ts" x="565" y="320" text-anchor="middle" dominant-baseline="central">operacional,</text><text class="ts" x="565" y="338" text-anchor="middle" dominant-baseline="central">processos melhores</text></g>
</svg>
