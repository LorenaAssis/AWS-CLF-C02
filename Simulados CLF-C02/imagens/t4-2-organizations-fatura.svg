<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 360" role="img"><title>Faturamento consolidado do AWS Organizations</title><desc>Três contas, vendas, RH e dados, gastam 3.000, 1.000 e 2.000 dólares. O Organizations soma o uso na conta de gerenciamento. Resultado: uma fatura única de 6.000 dólares, desconto por volume pelo uso somado e a instância reservada sem uso da conta vendas dando desconto na conta dados.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t{fill:#F1EFE8}.ts{fill:#D3D1C7}.th{fill:#F1EFE8}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="360"/>
<g class="c-gray"><rect x="25" y="30" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="120" y="48" text-anchor="middle" dominant-baseline="central">Conta vendas</text><text class="ts" x="120" y="70" text-anchor="middle" dominant-baseline="central">US$ 3.000 no mês</text><text class="ts" x="120" y="88" text-anchor="middle" dominant-baseline="central">RI comprada, sem uso</text></g>
<g class="c-gray"><rect x="245" y="30" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Conta RH</text><text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">US$ 1.000 no mês</text><text class="ts" x="340" y="88" text-anchor="middle" dominant-baseline="central">Sistemas internos</text></g>
<g class="c-gray"><rect x="465" y="30" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="560" y="48" text-anchor="middle" dominant-baseline="central">Conta dados</text><text class="ts" x="560" y="70" text-anchor="middle" dominant-baseline="central">US$ 2.000 no mês</text><text class="ts" x="560" y="88" text-anchor="middle" dominant-baseline="central">Usa instância igual</text></g>
<line x1="120" y1="102" x2="120" y2="137" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="102" x2="340" y2="137" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="102" x2="560" y2="137" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="25" y="140" width="630" height="60" rx="8" stroke-width="0.5"/><text class="th" x="340" y="160" text-anchor="middle" dominant-baseline="central">AWS Organizations: faturamento consolidado</text><text class="ts" x="340" y="182" text-anchor="middle" dominant-baseline="central">Soma o uso das 3 contas na conta de gerenciamento</text></g>
<line x1="120" y1="200" x2="120" y2="237" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="200" x2="340" y2="237" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="200" x2="560" y2="237" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="25" y="240" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="120" y="258" text-anchor="middle" dominant-baseline="central">Fatura única</text><text class="ts" x="120" y="280" text-anchor="middle" dominant-baseline="central">Total: US$ 6.000</text><text class="ts" x="120" y="298" text-anchor="middle" dominant-baseline="central">Uma forma de pagamento</text></g>
<g class="c-amber"><rect x="245" y="240" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="340" y="258" text-anchor="middle" dominant-baseline="central">Desconto por volume</text><text class="ts" x="340" y="280" text-anchor="middle" dominant-baseline="central">Uso somado chega</text><text class="ts" x="340" y="298" text-anchor="middle" dominant-baseline="central">à faixa mais barata</text></g>
<g class="c-amber"><rect x="465" y="240" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="560" y="258" text-anchor="middle" dominant-baseline="central">RI compartilhada</text><text class="ts" x="560" y="280" text-anchor="middle" dominant-baseline="central">Desconto da RI de vendas</text><text class="ts" x="560" y="298" text-anchor="middle" dominant-baseline="central">vale na conta dados</text></g>
<text class="t" x="340" y="338" text-anchor="middle" dominant-baseline="central">E ainda dá para ver o custo de cada conta separado</text>
</svg>
