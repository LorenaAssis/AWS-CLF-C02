<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 356" role="img"><title>Os 6 pilares do Well-Architected num app de delivery</title><desc>Um app de delivery aplica os 6 pilares. Excelência operacional: deploys pequenos e reversíveis. Confiabilidade: a AZ cai e o app se recupera sozinho. Eficiência de performance: serverless no pico do almoço. Otimização de custos: mede o gasto de cada equipe. Segurança: privilégio mínimo e criptografia. Sustentabilidade: metas de redução de energia. Pilares na mesma linha nas duas primeiras linhas são os pares que a prova mais confunde.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#EEEDFE}.c-purple .ts{fill:#EEEDFE}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="356"/>
<g class="c-gray"><rect x="40" y="16" width="600" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">App de delivery Comida Já na AWS</text><text class="ts" x="340" y="54" text-anchor="middle" dominant-baseline="central">Mesma cor nas linhas 1 e 2 = par de pilares que a prova confunde</text></g>
<g class="c-teal"><rect x="40" y="88" width="290" height="72" rx="8" stroke-width="0.5"/><text class="th" x="185" y="106" text-anchor="middle" dominant-baseline="central">Excelência operacional</text><text class="ts" x="185" y="126" text-anchor="middle" dominant-baseline="central">Como opero e melhoro?</text><text class="ts" x="185" y="144" text-anchor="middle" dominant-baseline="central">Ex.: deploys pequenos e reversíveis</text></g>
<g class="c-teal"><rect x="350" y="88" width="290" height="72" rx="8" stroke-width="0.5"/><text class="th" x="495" y="106" text-anchor="middle" dominant-baseline="central">Confiabilidade</text><text class="ts" x="495" y="126" text-anchor="middle" dominant-baseline="central">Como volto depois de uma falha?</text><text class="ts" x="495" y="144" text-anchor="middle" dominant-baseline="central">Ex.: AZ cai, app se recupera sozinho</text></g>
<g class="c-amber"><rect x="40" y="176" width="290" height="72" rx="8" stroke-width="0.5"/><text class="th" x="185" y="194" text-anchor="middle" dominant-baseline="central">Eficiência de performance</text><text class="ts" x="185" y="214" text-anchor="middle" dominant-baseline="central">Como uso o recurso certo?</text><text class="ts" x="185" y="232" text-anchor="middle" dominant-baseline="central">Ex.: serverless no pico do almoço</text></g>
<g class="c-amber"><rect x="350" y="176" width="290" height="72" rx="8" stroke-width="0.5"/><text class="th" x="495" y="194" text-anchor="middle" dominant-baseline="central">Otimização de custos</text><text class="ts" x="495" y="214" text-anchor="middle" dominant-baseline="central">Como gasto só o necessário?</text><text class="ts" x="495" y="232" text-anchor="middle" dominant-baseline="central">Ex.: mede o gasto de cada equipe</text></g>
<g class="c-purple"><rect x="40" y="264" width="290" height="72" rx="8" stroke-width="0.5"/><text class="th" x="185" y="282" text-anchor="middle" dominant-baseline="central">Segurança</text><text class="ts" x="185" y="302" text-anchor="middle" dominant-baseline="central">Como protejo dados e acessos?</text><text class="ts" x="185" y="320" text-anchor="middle" dominant-baseline="central">Ex.: privilégio mínimo e criptografia</text></g>
<g class="c-purple"><rect x="350" y="264" width="290" height="72" rx="8" stroke-width="0.5"/><text class="th" x="495" y="282" text-anchor="middle" dominant-baseline="central">Sustentabilidade</text><text class="ts" x="495" y="302" text-anchor="middle" dominant-baseline="central">Como reduzo o impacto ambiental?</text><text class="ts" x="495" y="320" text-anchor="middle" dominant-baseline="central">Ex.: metas de redução de energia</text></g>
</svg>
