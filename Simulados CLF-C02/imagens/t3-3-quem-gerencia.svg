<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 330" role="img"><title>Quem gerencia o quê: EC2, Beanstalk, Lambda e Fargate</title><desc>Comparação lado a lado. No EC2 (IaaS) você cuida do código e do servidor com sistema operacional. No Beanstalk (PaaS) você envia o código e a AWS provisiona os servidores. No Lambda e no Fargate (serverless) a AWS cuida dos servidores; você entrega a função ou a imagem do contêiner. O hardware físico é sempre da AWS.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="330"/>
<g class="c-gray"><rect x="128" y="20" width="124" height="76" rx="8" stroke-width="0.5"/><text class="th" x="190" y="40" text-anchor="middle" dominant-baseline="central">Amazon EC2</text><text class="ts" x="190" y="62" text-anchor="middle" dominant-baseline="central">IaaS</text><text class="ts" x="190" y="80" text-anchor="middle" dominant-baseline="central">controle do SO</text></g>
<g class="c-gray"><rect x="264" y="20" width="124" height="76" rx="8" stroke-width="0.5"/><text class="th" x="326" y="40" text-anchor="middle" dominant-baseline="central">Beanstalk</text><text class="ts" x="326" y="62" text-anchor="middle" dominant-baseline="central">PaaS</text><text class="ts" x="326" y="80" text-anchor="middle" dominant-baseline="central">envie o código</text></g>
<g class="c-gray"><rect x="400" y="20" width="124" height="76" rx="8" stroke-width="0.5"/><text class="th" x="462" y="40" text-anchor="middle" dominant-baseline="central">AWS Lambda</text><text class="ts" x="462" y="62" text-anchor="middle" dominant-baseline="central">serverless</text><text class="ts" x="462" y="80" text-anchor="middle" dominant-baseline="central">roda por evento</text></g>
<g class="c-gray"><rect x="536" y="20" width="124" height="76" rx="8" stroke-width="0.5"/><text class="th" x="598" y="40" text-anchor="middle" dominant-baseline="central">AWS Fargate</text><text class="ts" x="598" y="62" text-anchor="middle" dominant-baseline="central">serverless</text><text class="ts" x="598" y="80" text-anchor="middle" dominant-baseline="central">contêineres</text></g>
<text class="ts" x="16" y="130" dominant-baseline="central">Seu código</text>
<text class="ts" x="16" y="182" dominant-baseline="central">Servidor e SO</text>
<text class="ts" x="16" y="234" dominant-baseline="central">Hardware</text>
<g class="c-amber"><rect x="128" y="110" width="532" height="40" rx="8" stroke-width="0.5"/><text class="th" x="394" y="130" text-anchor="middle" dominant-baseline="central">Você: o código (ou a imagem do contêiner)</text></g>
<g class="c-amber"><rect x="128" y="162" width="124" height="40" rx="8" stroke-width="0.5"/><text class="th" x="190" y="182" text-anchor="middle" dominant-baseline="central">Você</text></g>
<g class="c-teal"><rect x="264" y="162" width="396" height="40" rx="8" stroke-width="0.5"/><text class="th" x="462" y="182" text-anchor="middle" dominant-baseline="central">AWS provisiona e gerencia</text></g>
<g class="c-teal"><rect x="128" y="214" width="532" height="40" rx="8" stroke-width="0.5"/><text class="th" x="394" y="234" text-anchor="middle" dominant-baseline="central">AWS: hardware físico e data centers</text></g>
<line x1="128" y1="282" x2="660" y2="282" class="arr" marker-end="url(#arrow)"/>
<text class="t" x="394" y="306" text-anchor="middle" dominant-baseline="central">Para a direita: menos servidor para você cuidar</text>
</svg>
