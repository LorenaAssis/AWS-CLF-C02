<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 322" role="img"><title>Três jeitos de chegar à VPC: Site-to-Site VPN, Direct Connect e Client VPN</title><desc>O data center da empresa liga na VPC por um túnel criptografado pela internet (Site-to-Site VPN) ou por um link físico dedicado que não passa pela internet (Direct Connect). Uma funcionária em home office entra sozinha pelo Client VPN.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#E6F1FB}.c-blue .ts{fill:#85B7EB}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="322"/>
<g class="c-gray"><rect x="20" y="28" width="150" height="156" rx="8" stroke-width="0.5"/><text class="th" x="95" y="96" text-anchor="middle" dominant-baseline="central">Data center</text><text class="ts" x="95" y="116" text-anchor="middle" dominant-baseline="central">da empresa</text></g>
<g class="c-teal"><rect x="230" y="28" width="220" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="44" text-anchor="middle" dominant-baseline="central">Site-to-Site VPN</text><text class="ts" x="340" y="62" text-anchor="middle" dominant-baseline="central">túnel criptografado</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">pela internet pública</text></g>
<g class="c-amber"><rect x="230" y="120" width="220" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="136" text-anchor="middle" dominant-baseline="central">Direct Connect</text><text class="ts" x="340" y="154" text-anchor="middle" dominant-baseline="central">link físico dedicado</text><text class="ts" x="340" y="170" text-anchor="middle" dominant-baseline="central">não passa pela internet</text></g>
<g class="c-gray"><rect x="20" y="212" width="150" height="64" rx="8" stroke-width="0.5"/><text class="th" x="95" y="234" text-anchor="middle" dominant-baseline="central">Notebook da ana</text><text class="ts" x="95" y="254" text-anchor="middle" dominant-baseline="central">home office</text></g>
<g class="c-blue"><rect x="230" y="212" width="220" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">Client VPN</text><text class="ts" x="340" y="246" text-anchor="middle" dominant-baseline="central">acesso de um usuário</text><text class="ts" x="340" y="262" text-anchor="middle" dominant-baseline="central">pela internet</text></g>
<g class="c-gray"><rect x="510" y="28" width="150" height="248" rx="8" stroke-width="0.5"/><text class="th" x="585" y="142" text-anchor="middle" dominant-baseline="central">VPC na AWS</text><text class="ts" x="585" y="162" text-anchor="middle" dominant-baseline="central">10.0.0.0/16</text></g>
<line x1="170" y1="60" x2="228" y2="60" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="60" x2="508" y2="60" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="152" x2="228" y2="152" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="152" x2="508" y2="152" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="244" x2="228" y2="244" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="244" x2="508" y2="244" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="20" y="304" dominant-baseline="central">VPN: pronta em pouco tempo. Direct Connect: mais estável, mas demora para instalar.</text>
</svg>
