<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 392" role="img"><title>Degraus das classes do S3 com regra de ciclo de vida</title><desc>As classes do S3 formam uma escada: Standard, Standard-IA, Glacier Instant Retrieval, Glacier Flexible Retrieval e Glacier Deep Archive. Quanto mais para a direita, mais barato guardar e mais lento ler. A regra de ciclo de vida do bucket fotos-loja desce as fotos pela idade; o Intelligent-Tiering troca de degrau sozinho pelo uso.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#E6F1FB}.c-blue .ts{fill:#85B7EB}
.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#EEEDFE}.c-purple .ts{fill:#AFA9EC}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="392"/>
<g class="c-gray"><rect x="14" y="16" width="400" height="72" rx="8" stroke-width="0.5"/><text class="th" x="214" y="34" text-anchor="middle" dominant-baseline="central">Ciclo de vida do bucket fotos-loja</text><text class="ts" x="214" y="54" text-anchor="middle" dominant-baseline="central">após 30 dias: vai para Standard-IA</text><text class="ts" x="214" y="72" text-anchor="middle" dominant-baseline="central">após 90 dias: Glacier Flexible; 1 ano: Deep Archive</text></g>
<g class="c-amber"><rect x="430" y="16" width="236" height="72" rx="8" stroke-width="0.5"/><text class="th" x="548" y="34" text-anchor="middle" dominant-baseline="central">Intelligent-Tiering</text><text class="ts" x="548" y="54" text-anchor="middle" dominant-baseline="central">uso imprevisível?</text><text class="ts" x="548" y="72" text-anchor="middle" dominant-baseline="central">a AWS troca de degrau</text></g>
<g class="c-blue"><rect x="14" y="110" width="124" height="250" rx="8" stroke-width="0.5"/><text class="th" x="76" y="130" text-anchor="middle" dominant-baseline="central">Standard</text><text class="ts" x="76" y="150" text-anchor="middle" dominant-baseline="central">uso frequente</text><text class="ts" x="76" y="168" text-anchor="middle" dominant-baseline="central">foto nova</text></g>
<g class="c-blue"><rect x="146" y="150" width="124" height="210" rx="8" stroke-width="0.5"/><text class="th" x="208" y="170" text-anchor="middle" dominant-baseline="central">Standard-IA</text><text class="ts" x="208" y="190" text-anchor="middle" dominant-baseline="central">uso raro,</text><text class="ts" x="208" y="208" text-anchor="middle" dominant-baseline="central">abre na hora</text></g>
<g class="c-purple"><rect x="278" y="190" width="124" height="170" rx="8" stroke-width="0.5"/><text class="th" x="340" y="210" text-anchor="middle" dominant-baseline="central">Glacier</text><text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">Instant</text><text class="ts" x="340" y="248" text-anchor="middle" dominant-baseline="central">arquivo,</text><text class="ts" x="340" y="266" text-anchor="middle" dominant-baseline="central">milissegundos</text></g>
<g class="c-purple"><rect x="410" y="230" width="124" height="130" rx="8" stroke-width="0.5"/><text class="th" x="472" y="250" text-anchor="middle" dominant-baseline="central">Glacier</text><text class="th" x="472" y="268" text-anchor="middle" dominant-baseline="central">Flexible</text><text class="ts" x="472" y="288" text-anchor="middle" dominant-baseline="central">minutos a horas</text></g>
<g class="c-purple"><rect x="542" y="270" width="124" height="90" rx="8" stroke-width="0.5"/><text class="th" x="604" y="288" text-anchor="middle" dominant-baseline="central">Glacier</text><text class="th" x="604" y="306" text-anchor="middle" dominant-baseline="central">Deep Archive</text><text class="ts" x="604" y="326" text-anchor="middle" dominant-baseline="central">o mais barato</text><text class="ts" x="604" y="344" text-anchor="middle" dominant-baseline="central">guardar anos</text></g>
<text class="ts" x="14" y="380" dominant-baseline="central">guardar caro, ler rápido</text>
<line x1="186" y1="380" x2="474" y2="380" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="666" y="380" text-anchor="end" dominant-baseline="central">guardar barato, ler devagar</text>
</svg>
