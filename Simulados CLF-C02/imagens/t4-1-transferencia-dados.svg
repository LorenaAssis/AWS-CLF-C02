<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 390" role="img"><title>Quanto custa a transferência de dados na AWS</title><desc>A loja-da-ana roda na Região sa-east-1. Dados que entram da internet são grátis; dados que saem para a internet são cobrados. Dentro da mesma AZ, por IP privado, é grátis; entre AZs cobra pouco. Copiar dados para outra Região, us-east-1, é cobrado.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t{fill:#F1EFE8}.ts{fill:#D3D1C7}.th{fill:#F1EFE8}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="390"/>
<g class="c-gray"><rect x="125" y="24" width="200" height="50" rx="8" stroke-width="0.5"/><text class="th" x="225" y="41" text-anchor="middle" dominant-baseline="central">Internet</text><text class="ts" x="225" y="59" text-anchor="middle" dominant-baseline="central">Clientes da loja</text></g>
<g class="c-teal"><rect x="20" y="120" width="420" height="225" rx="12" stroke-width="0.5"/><text class="th" x="424" y="140" text-anchor="end" dominant-baseline="central">Região sa-east-1</text></g>
<g class="c-gray"><rect x="150" y="160" width="270" height="70" rx="8" stroke-width="0.5"/><text class="th" x="285" y="182" text-anchor="middle" dominant-baseline="central">AZ a: EC2 web e app</text><text class="ts" x="285" y="208" text-anchor="middle" dominant-baseline="central">Mesma AZ, IP privado: grátis</text></g>
<g class="c-gray"><rect x="150" y="260" width="270" height="70" rx="8" stroke-width="0.5"/><text class="th" x="285" y="282" text-anchor="middle" dominant-baseline="central">AZ b: banco réplica</text><text class="ts" x="285" y="308" text-anchor="middle" dominant-baseline="central">Recebe cópia da AZ a</text></g>
<line x1="190" y1="74" x2="190" y2="157" class="arr" marker-end="url(#arrow)"/>
<line x1="260" y1="159" x2="260" y2="77" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="182" y="97" text-anchor="end" dominant-baseline="central">Entrada: grátis</text>
<text class="ts" x="268" y="97" dominant-baseline="central">Saída: cobrada</text>
<line x1="170" y1="230" x2="170" y2="257" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="34" y="238" dominant-baseline="central">Entre AZs:</text>
<text class="ts" x="34" y="256" dominant-baseline="central">cobra pouco</text>
<line x1="420" y1="195" x2="497" y2="195" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="580" y="145" text-anchor="middle" dominant-baseline="central">Entre Regiões: cobrada</text>
<g class="c-amber"><rect x="500" y="165" width="160" height="60" rx="8" stroke-width="0.5"/><text class="th" x="580" y="184" text-anchor="middle" dominant-baseline="central">Região us-east-1</text><text class="ts" x="580" y="206" text-anchor="middle" dominant-baseline="central">Cópia de backup</text></g>
<text class="t" x="340" y="370" text-anchor="middle" dominant-baseline="central">Regra: entrar é grátis; sair ou cruzar Região custa</text>
</svg>
