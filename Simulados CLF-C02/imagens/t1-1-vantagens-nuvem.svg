<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 372" role="img"><title>Servidor próprio x nuvem AWS: as 6 vantagens</title><desc>Uma loja online precisa de servidores para uma promoção. No servidor próprio ela compra 3 servidores antes de usar, espera semanas e chuta a capacidade. Na nuvem paga por hora, cria o servidor em minutos e escala no pico. Abaixo, as outras 3 vantagens: economias de escala, parar de gastar com data center e global em minutos.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="372"/>
<g class="c-amber"><rect x="40" y="16" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="32" text-anchor="middle" dominant-baseline="central">Servidor próprio</text><text class="ts" x="170" y="50" text-anchor="middle" dominant-baseline="central">On-premises, custo fixo</text></g>
<g class="c-teal"><rect x="380" y="16" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="510" y="32" text-anchor="middle" dominant-baseline="central">Nuvem AWS</text><text class="ts" x="510" y="50" text-anchor="middle" dominant-baseline="central">Sob demanda, custo variável</text></g>
<g class="c-amber"><rect x="40" y="76" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="94" text-anchor="middle" dominant-baseline="central">Compra 3 servidores</text><text class="ts" x="170" y="114" text-anchor="middle" dominant-baseline="central">R$ 90 mil antes de usar (CapEx)</text></g>
<line x1="300" y1="104" x2="378" y2="104" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="380" y="76" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="94" text-anchor="middle" dominant-baseline="central">Paga por hora de uso</text><text class="ts" x="510" y="114" text-anchor="middle" dominant-baseline="central">Despesa variável (OpEx)</text></g>
<g class="c-amber"><rect x="40" y="148" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="166" text-anchor="middle" dominant-baseline="central">Espera semanas</text><text class="ts" x="170" y="186" text-anchor="middle" dominant-baseline="central">Entrega, instalação e rede</text></g>
<line x1="300" y1="176" x2="378" y2="176" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="380" y="148" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="166" text-anchor="middle" dominant-baseline="central">Servidor em minutos</text><text class="ts" x="510" y="186" text-anchor="middle" dominant-baseline="central">Velocidade e agilidade</text></g>
<g class="c-amber"><rect x="40" y="220" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="238" text-anchor="middle" dominant-baseline="central">Chuta a capacidade</text><text class="ts" x="170" y="258" text-anchor="middle" dominant-baseline="central">Sobra no ano, falta no pico</text></g>
<line x1="300" y1="248" x2="378" y2="248" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="380" y="220" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="238" text-anchor="middle" dominant-baseline="central">Escala no pico e volta</text><text class="ts" x="510" y="258" text-anchor="middle" dominant-baseline="central">Pare de adivinhar a capacidade</text></g>
<g class="c-gray"><rect x="40" y="296" width="600" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="314" text-anchor="middle" dominant-baseline="central">As outras 3 vantagens</text><text class="ts" x="340" y="334" text-anchor="middle" dominant-baseline="central">Economias de escala   ·   Sem gastar com data center   ·   Global em minutos</text></g>
</svg>
