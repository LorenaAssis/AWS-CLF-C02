<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 380" role="img"><title>AWS WAF x AWS Shield</title><desc>Black Friday da loja de perfumes. À esquerda, um pedido com SQL injection ou de um país bloqueado chega ao WAF, que lê o conteúdo HTTP na camada 7 e bloqueia; o cliente legítimo passa. À direita, milhares de bots inundam o site num ataque DDoS; o Shield, nas camadas 3 e 4, absorve o volume e o site continua no ar. Para várias contas, o Firewall Manager aplica as regras de forma central.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-red rect{fill:#FCEBEB;stroke:#A32D2D}.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-red rect{fill:#791F1F;stroke:#F09595}.c-red .th{fill:#FCEBEB}.c-red .ts{fill:#FCEBEB}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="380"/>
<text class="th" x="340" y="22" text-anchor="middle" dominant-baseline="central">Black Friday da loja-perfumes</text>
<text class="th" x="175" y="54" text-anchor="middle" dominant-baseline="central">WAF: filtra o conteúdo</text>
<text class="th" x="505" y="54" text-anchor="middle" dominant-baseline="central">Shield: segura o volume</text>
<g class="c-gray"><rect x="40" y="76" width="270" height="60" rx="8" stroke-width="0.5"/><text class="th" x="175" y="96" text-anchor="middle" dominant-baseline="central">Pedido malicioso</text><text class="ts" x="175" y="118" text-anchor="middle" dominant-baseline="central">SQL injection ou país bloqueado</text></g>
<line x1="175" y1="136" x2="175" y2="164" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="166" width="270" height="80" rx="8" stroke-width="0.5"/><text class="th" x="175" y="188" text-anchor="middle" dominant-baseline="central">AWS WAF</text><text class="ts" x="175" y="210" text-anchor="middle" dominant-baseline="central">Camada 7: lê o pedido HTTP</text><text class="ts" x="175" y="230" text-anchor="middle" dominant-baseline="central">Regras: país, IP, SQL, XSS</text></g>
<line x1="175" y1="246" x2="175" y2="274" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="40" y="276" width="270" height="60" rx="8" stroke-width="0.5"/><text class="th" x="175" y="296" text-anchor="middle" dominant-baseline="central">Pedido bloqueado</text><text class="ts" x="175" y="318" text-anchor="middle" dominant-baseline="central">Cliente legítimo passa normal</text></g>
<g class="c-gray"><rect x="370" y="76" width="270" height="60" rx="8" stroke-width="0.5"/><text class="th" x="505" y="96" text-anchor="middle" dominant-baseline="central">Milhares de bots</text><text class="ts" x="505" y="118" text-anchor="middle" dominant-baseline="central">Enxurrada de tráfego (DDoS)</text></g>
<line x1="505" y1="136" x2="505" y2="164" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="370" y="166" width="270" height="80" rx="8" stroke-width="0.5"/><text class="th" x="505" y="188" text-anchor="middle" dominant-baseline="central">AWS Shield</text><text class="ts" x="505" y="210" text-anchor="middle" dominant-baseline="central">Camadas 3 e 4: absorve o volume</text><text class="ts" x="505" y="230" text-anchor="middle" dominant-baseline="central">Standard: grátis e automático</text></g>
<line x1="505" y1="246" x2="505" y2="274" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="370" y="276" width="270" height="60" rx="8" stroke-width="0.5"/><text class="th" x="505" y="296" text-anchor="middle" dominant-baseline="central">Site continua no ar</text><text class="ts" x="505" y="318" text-anchor="middle" dominant-baseline="central">Advanced (pago): DRT 24x7</text></g>
<text class="ts" x="340" y="360" text-anchor="middle" dominant-baseline="central">Muitas contas? O Firewall Manager aplica as regras de forma central</text>
</svg>
