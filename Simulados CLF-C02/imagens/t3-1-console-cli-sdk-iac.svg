<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 400" role="img"><title>Quatro caminhos para criar 10 servidores iguais</title><desc>O mesmo pedido, criar 10 servidores iguais em dev, teste e produção, resolvido pelo Console (clicando, operação única), pela CLI (comandos em script), pelo SDK (o código da aplicação chama a API) e pelo CloudFormation (template que vira uma pilha, infraestrutura como código). Da esquerda para a direita, mais automação e repetição.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.t,.th{fill:#F1EFE8}.ts{fill:#D3D1C7}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-blue rect{fill:#0C447C;stroke:#85B7EB}.c-blue .th{fill:#E6F1FB}.c-blue .ts{fill:#85B7EB}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="400"/>
<g class="c-gray"><rect x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">Pedido: 10 servidores iguais</text><text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">em dev, teste e produção</text></g>
<line x1="250" y1="76" x2="91" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="310" y1="76" x2="257" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="370" y1="76" x2="423" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="430" y1="76" x2="589" y2="118" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="16" y="120" width="150" height="76" rx="8" stroke-width="0.5"/><text class="th" x="91" y="140" text-anchor="middle" dominant-baseline="central">Console</text><text class="ts" x="91" y="162" text-anchor="middle" dominant-baseline="central">clica no navegador</text><text class="ts" x="91" y="180" text-anchor="middle" dominant-baseline="central">10 vezes, à mão</text></g>
<g class="c-blue"><rect x="182" y="120" width="150" height="76" rx="8" stroke-width="0.5"/><text class="th" x="257" y="140" text-anchor="middle" dominant-baseline="central">AWS CLI</text><text class="ts" x="257" y="162" text-anchor="middle" dominant-baseline="central">comando no terminal</text><text class="ts" x="257" y="180" text-anchor="middle" dominant-baseline="central">salvo num script</text></g>
<g class="c-blue"><rect x="348" y="120" width="150" height="76" rx="8" stroke-width="0.5"/><text class="th" x="423" y="140" text-anchor="middle" dominant-baseline="central">SDK</text><text class="ts" x="423" y="162" text-anchor="middle" dominant-baseline="central">dentro do código</text><text class="ts" x="423" y="180" text-anchor="middle" dominant-baseline="central">do app (Python)</text></g>
<g class="c-teal"><rect x="514" y="120" width="150" height="76" rx="8" stroke-width="0.5"/><text class="th" x="589" y="140" text-anchor="middle" dominant-baseline="central">CloudFormation</text><text class="ts" x="589" y="162" text-anchor="middle" dominant-baseline="central">template YAML</text><text class="ts" x="589" y="180" text-anchor="middle" dominant-baseline="central">cria uma pilha</text></g>
<line x1="91" y1="196" x2="91" y2="226" class="arr" marker-end="url(#arrow)"/>
<line x1="257" y1="196" x2="257" y2="226" class="arr" marker-end="url(#arrow)"/>
<line x1="423" y1="196" x2="423" y2="226" class="arr" marker-end="url(#arrow)"/>
<line x1="589" y1="196" x2="589" y2="226" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="16" y="228" width="150" height="76" rx="8" stroke-width="0.5"/><text class="th" x="91" y="248" text-anchor="middle" dominant-baseline="central">Operação única</text><text class="ts" x="91" y="270" text-anchor="middle" dominant-baseline="central">lento e com risco</text><text class="ts" x="91" y="288" text-anchor="middle" dominant-baseline="central">de erro humano</text></g>
<g class="c-blue"><rect x="182" y="228" width="150" height="76" rx="8" stroke-width="0.5"/><text class="th" x="257" y="248" text-anchor="middle" dominant-baseline="central">Repetível</text><text class="ts" x="257" y="270" text-anchor="middle" dominant-baseline="central">acesso programático</text><text class="ts" x="257" y="288" text-anchor="middle" dominant-baseline="central">sem clicar</text></g>
<g class="c-blue"><rect x="348" y="228" width="150" height="76" rx="8" stroke-width="0.5"/><text class="th" x="423" y="248" text-anchor="middle" dominant-baseline="central">Repetível</text><text class="ts" x="423" y="270" text-anchor="middle" dominant-baseline="central">a aplicação chama</text><text class="ts" x="423" y="288" text-anchor="middle" dominant-baseline="central">a API sozinha</text></g>
<g class="c-teal"><rect x="514" y="228" width="150" height="76" rx="8" stroke-width="0.5"/><text class="th" x="589" y="248" text-anchor="middle" dominant-baseline="central">IaC, repetível</text><text class="ts" x="589" y="270" text-anchor="middle" dominant-baseline="central">mesmo ambiente</text><text class="ts" x="589" y="288" text-anchor="middle" dominant-baseline="central">em qualquer conta</text></g>
<line x1="40" y1="330" x2="640" y2="330" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="24" y="352" dominant-baseline="central">Manual, uma vez</text>
<text class="ts" x="656" y="352" text-anchor="end" dominant-baseline="central">Automatizado, repetível</text>
<text class="ts" x="340" y="380" text-anchor="middle" dominant-baseline="central">Todos usam as mesmas APIs da AWS por baixo</text>
</svg>
