<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 372" role="img"><title>CapEx x OpEx e rightsizing</title><desc>Dois gráficos com a mesma demanda ao longo do ano. No on-premises a capacidade comprada é fixa no nível do pico, e o espaço entre ela e a demanda é ocioso, mas pago. Na nuvem a capacidade acompanha a demanda e você paga só o que usa. Embaixo, o rightsizing: uma instância grande com CPU em 8% é trocada por uma menor, com CPU em 45% e conta menor.</desc>
<style>
svg{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.bg{fill:#ffffff}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.cap{stroke:#854F0B;stroke-width:2;fill:none;stroke-dasharray:6 4}
.dem{stroke:#0F6E56;stroke-width:2;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b1a}.arr{stroke:#B4B2A9}
.cap{stroke:#EF9F27}.dem{stroke:#5DCAA5}
.c-gray rect{fill:#444441;stroke:#B4B2A9}.c-gray .th{fill:#F1EFE8}.c-gray .ts{fill:#D3D1C7}
.c-teal rect{fill:#085041;stroke:#5DCAA5}.c-teal .th{fill:#E1F5EE}.c-teal .ts{fill:#9FE1CB}
.c-amber rect{fill:#633806;stroke:#EF9F27}.c-amber .th{fill:#FAEEDA}.c-amber .ts{fill:#FAC775}
.c-purple rect{fill:#3C3489;stroke:#AFA9EC}.c-purple .th{fill:#EEEDFE}.c-purple .ts{fill:#EEEDFE}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="372"/>
<g class="c-amber"><rect x="40" y="16" width="290" height="206" rx="12" stroke-width="0.5"/><text class="th" x="185" y="38" text-anchor="middle" dominant-baseline="central">On-premises: custo fixo (CapEx)</text>
<line x1="60" y1="66" x2="60" y2="190" class="arr"/><line x1="60" y1="190" x2="310" y2="190" class="arr"/>
<path d="M60 88 H310" class="cap"/>
<path d="M60 172 L100 166 L140 160 L170 150 L200 124 L230 102 L260 120 L290 158 L310 166" class="dem"/>
<text class="ts" x="185" y="72" text-anchor="middle" dominant-baseline="central">Capacidade comprada</text>
<text class="ts" x="76" y="116" dominant-baseline="central">Ocioso, mas pago</text>
<text class="ts" x="72" y="140" dominant-baseline="central">Demanda real</text>
<text class="ts" x="185" y="206" text-anchor="middle" dominant-baseline="central">Paga o pico o ano todo</text></g>
<g class="c-teal"><rect x="350" y="16" width="290" height="206" rx="12" stroke-width="0.5"/><text class="th" x="495" y="38" text-anchor="middle" dominant-baseline="central">Nuvem: custo variável (OpEx)</text>
<line x1="370" y1="66" x2="370" y2="190" class="arr"/><line x1="370" y1="190" x2="620" y2="190" class="arr"/>
<path d="M370 152 H450 V140 H480 V116 H510 V94 H570 V114 H600 V150 H620" class="cap"/>
<path d="M370 172 L410 166 L450 160 L480 150 L510 124 L540 102 L570 120 L600 158 L620 166" class="dem"/>
<text class="ts" x="495" y="72" text-anchor="middle" dominant-baseline="central">Capacidade acompanha a demanda</text>
<text class="ts" x="495" y="206" text-anchor="middle" dominant-baseline="central">Paga só o que usa</text></g>
<g class="c-amber"><rect x="40" y="250" width="170" height="72" rx="8" stroke-width="0.5"/><text class="th" x="125" y="268" text-anchor="middle" dominant-baseline="central">Instância grande</text><text class="ts" x="125" y="288" text-anchor="middle" dominant-baseline="central">CPU em 8%</text><text class="ts" x="125" y="306" text-anchor="middle" dominant-baseline="central">o mês inteiro</text></g>
<line x1="210" y1="286" x2="248" y2="286" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="250" y="250" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="345" y="268" text-anchor="middle" dominant-baseline="central">Rightsizing</text><text class="ts" x="345" y="288" text-anchor="middle" dominant-baseline="central">Ajusta o tamanho</text><text class="ts" x="345" y="306" text-anchor="middle" dominant-baseline="central">ao uso real</text></g>
<line x1="440" y1="286" x2="478" y2="286" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="480" y="250" width="160" height="72" rx="8" stroke-width="0.5"/><text class="th" x="560" y="268" text-anchor="middle" dominant-baseline="central">Instância menor</text><text class="ts" x="560" y="288" text-anchor="middle" dominant-baseline="central">CPU em 45%</text><text class="ts" x="560" y="306" text-anchor="middle" dominant-baseline="central">conta bem menor</text></g>
<text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">Rightsizing muda o tamanho; Auto Scaling muda a quantidade</text>
</svg>
