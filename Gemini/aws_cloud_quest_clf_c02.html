  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Flashcard 3D Flip Mechanics */
    .perspective-1000 {
      perspective: 1200px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Subtle Pulse for Current Active Node */
    @keyframes pulseRing {
      0% {
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.55);
      }
      70% {
        box-shadow: 0 0 0 12px rgba(245, 158, 11, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
      }
    }
    .node-active-pulse {
      animation: pulseRing 2.2s infinite;
    }

    /* Smooth Fade In */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-up {
      animation: fadeSlideUp 0.28s ease-out forwards;
    }

    /* Confetti particle animation */
    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(260px) rotate(720deg);
        opacity: 0;
      }
    }
    .confetti-piece {
      position: fixed;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 9999;
      animation: confettiFall 1.5s ease-out forwards;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>

    // =========================================================================
    // 2. ESTADO GLOBAL & PERSISTÊNCIA (LOCALSTORAGE)
    // =========================================================================
    const STORAGE_KEY = 'aws_cloud_quest_clf_c02_v1';

    const defaultState = {
      xp: 0,
      completedLessons: [],     // array of lesson IDs
      masteredFlashcards: [],   // array of flashcard IDs
      soundEnabled: true,
      activeMainTab: 'trail',   // 'trail' | 'cram' | 'exam'
      activeCramSubTab: 'flashcards', // 'flashcards' | 'radar' | 'battles'
      lastExamResult: null,     // { date, scaledScore, correctCount, totalCount, domainBreakdown }
      wrongQuestionIds: []      // array of question IDs missed in last/recent exams
    };

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...defaultState };
        const parsed = JSON.parse(raw);
        return { ...defaultState, ...parsed };
      } catch (e) {
        return { ...defaultState };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Erro ao salvar no localStorage:', e);
      }
      updateHeaderUI();
    }

    // =========================================================================
    // 3. EFEITOS SONOROS SINTETIZADOS (WEB AUDIO API - ZERO URLS EXTERNAS)
    // =========================================================================
    let audioCtx = null;

    function playSound(type) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);       // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(175, now + 0.1);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'levelup') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);        // C5
          osc.frequency.setValueAtTime(659.25, now + 0.09); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.18); // G5
          osc.frequency.setValueAtTime(1046.5, now + 0.27); // C6
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        } else if (type === 'flip') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.09);
        }
      } catch (e) {
        // Ignore audio errors on restricted devices
      }
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      saveState();
      showToast(state.soundEnabled ? '🔊 Sons ativados' : '🔇 Sons silenciados', 'cyan');
    }

    // =========================================================================
    // 4. UTILITÁRIOS DE GAMIFICAÇÃO, CONFETE E TOASTS
    // =========================================================================
    function addXP(amount, reason = '') {
      state.xp += amount;
      saveState();
      if (reason) {
        showToast(`⚡ +${amount} XP • ${reason}`, 'amber');
      }
    }

    function getLevelInfo(xp) {
      if (xp < 150) return { level: 1, title: 'Explorador da Nuvem' };
      if (xp < 350) return { level: 2, title: 'Aprendiz AWS' };
      if (xp < 600) return { level: 3, title: 'Arquiteto Iniciante' };
      if (xp < 900) return { level: 4, title: 'Especialista em Nuvem' };
      return { level: 5, title: 'Mestre Cloud Practitioner' };
    }

    function calculateOverallProgress() {
      const totalLessons = MODULES.reduce((acc, m) => acc + m.lessons.length, 0); // 13
      const totalCards = FLASHCARDS.length; // 24
      const lessonRatio = state.completedLessons.length / totalLessons;
      const cardRatio = state.masteredFlashcards.length / totalCards;
      // 70% weight for lessons, 30% weight for flashcards
      const pct = Math.round((lessonRatio * 0.7 + cardRatio * 0.3) * 100);
      return Math.min(100, Math.max(0, pct));
    }

    function updateHeaderUI() {
      const pct = calculateOverallProgress();
      const lvl = getLevelInfo(state.xp);

      document.getElementById('header-progress-text').textContent = `${pct}%`;
      document.getElementById('header-progress-bar').style.width = `${pct}%`;
      document.getElementById('header-xp-value').textContent = `${state.xp} XP`;
      document.getElementById('header-level-label').textContent = `Nível ${lvl.level} • ${lvl.title}`;
      document.getElementById('sound-icon').textContent = state.soundEnabled ? '🔊' : '🔇';

      // Update main tab button active styles
      const tabs = ['trail', 'cram', 'exam'];
      tabs.forEach((t) => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (!btn) return;
        if (state.activeMainTab === t) {
          btn.className =
            'main-tab-btn flex items-center justify-center gap-1.5 sm:gap-2 py-2.5 px-2 sm:px-4 rounded-xl text-xs sm:text-sm font-bold transition border bg-amber-500/15 border-amber-500 text-amber-300 shadow-sm shadow-amber-500/10';
        } else {
          btn.className =
            'main-tab-btn flex items-center justify-center gap-1.5 sm:gap-2 py-2.5 px-2 sm:px-4 rounded-xl text-xs sm:text-sm font-semibold transition border bg-[#1e293b]/70 border-[#334155] text-slate-400 hover:text-slate-200 hover:border-slate-500';
        }
      });
    }

    function showToast(message, accent = 'emerald') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const borderClass =
        accent === 'amber'
          ? 'border-amber-500/60 text-amber-200'
          : accent === 'cyan'
          ? 'border-cyan-500/60 text-cyan-200'
          : 'border-emerald-500/60 text-emerald-200';

      toast.className = `px-4 py-2.5 rounded-xl bg-[#1e293b] border ${borderClass} shadow-xl text-xs sm:text-sm font-bold animate-fade-up`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2400);
    }

    function triggerConfettiBurst() {
      const colors = ['#f59e0b', '#38bdf8', '#10b981', '#fbbf24', '#34d399'];
      for (let i = 0; i < 32; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.top = `${Math.random() * 20}vh`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDuration = `${1.1 + Math.random() * 0.9}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2100);
      }
    }

    // Custom Confirmation Modal (replaces browser confirm())
    let pendingConfirmCallback = null;

    function openConfirmModal(title, message, btnText, callback) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      const btn = document.getElementById('confirm-action-btn');
      btn.textContent = btnText;
      pendingConfirmCallback = callback;
      btn.onclick = () => {
        closeConfirmModal();
        if (pendingConfirmCallback) pendingConfirmCallback();
      };
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
      pendingConfirmCallback = null;
    }

    function openResetModal() {
      openConfirmModal(
        'Resetar Todo o Progresso?',
        'Isso vai zerar seu XP acumulado, aulas concluídas, flashcards dominados e histórico de simulados salvos neste navegador.',
        'Sim, Zerar Tudo',
        () => {
          localStorage.removeItem(STORAGE_KEY);
          state = { ...defaultState };
          saveState();
          renderActiveMainTab();
          showToast('Progresso reiniciado com sucesso', 'cyan');
        }
      );
    }

    // =========================================================================
    // 5. NAVEGAÇÃO PRINCIPAL
    // =========================================================================
    function switchMainTab(tabName) {
      if (examState.active && examState.timerInterval && tabName !== 'exam') {
        clearInterval(examState.timerInterval);
        examState.timerInterval = null;
      }
      state.activeMainTab = tabName;
      saveState();
      renderActiveMainTab();
    }

    function renderActiveMainTab() {
      updateHeaderUI();
      const main = document.getElementById('app-main');
      if (state.activeMainTab === 'trail') {
        renderTrailView(main);
      } else if (state.activeMainTab === 'cram') {
        renderCramView(main);
      } else if (state.activeMainTab === 'exam') {
        renderExamView(main);
      }
    }

    // =========================================================================
    // 6. ABA 1: TRILHA DO CURSO (MICROMÓDULOS INTERATIVOS ESTILO DUOLINGO)
    // =========================================================================

      const list = [];

        mod.lessons.forEach((lesson) => {
          list.push({ ...lesson, moduleId: mod.id, moduleNumber: mod.number, moduleTitle: mod.title, moduleWeight: mod.weight });
        });
      });
      return list;
    }

        mod.lessons.forEach((lesson, idx) => {
          const isDone = state.completedLessons.includes(lesson.id);
          const isNext = nextLesson && nextLesson.id === lesson.id && !isDone;

          const cardBorder = isDone
            ? 'border-emerald-500/60 bg-emerald-950/20 hover:bg-emerald-950/35'
            : isNext
            ? 'border-amber-500 bg-[#0f172a] node-active-pulse hover:bg-slate-900'
            : 'border-[#334155] bg-[#0f172a]/80 hover:border-cyan-500/50 hover:bg-[#0f172a]';

          html += `
            <button onclick="openLesson('${lesson.id}')" class="group text-left p-4 rounded-2xl border ${cardBorder} transition flex flex-col justify-between gap-3 relative overflow-hidden">
              <div class="flex items-start justify-between gap-2">
                <div class="w-11 h-11 rounded-xl ${
                  isDone
                    ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300'
                    : isNext
                    ? 'bg-amber-500/20 border border-amber-500/50 text-amber-300'
                    : 'bg-[#1e293b] border border-[#334155] text-slate-200'
                } flex items-center justify-center text-xl shrink-0 group-hover:scale-105 transition">
                  ${isDone ? '✓' : lesson.icon}
                </div>
                <span class="px-2 py-0.5 rounded-md text-[11px] font-mono font-bold ${
                  isDone
                    ? 'bg-emerald-500/20 text-emerald-300'
                    : isNext
                    ? 'bg-amber-500 text-slate-950'
                    : 'bg-[#1e293b] text-slate-400'
                }">
                  ${isDone ? 'CONCLUÍDA' : isNext ? 'PRÓXIMA' : `AULA ${mod.number}.${idx + 1}`}
                </span>
              </div>

              <div>
                <h4 class="font-bold text-sm sm:text-base text-white group-hover:text-amber-300 transition leading-snug">
                  ${lesson.title}
                </h4>
                <div class="flex items-center gap-2 mt-2 text-xs text-slate-400">
                  <span>⏱️ ${lesson.duration}</span>
                  <span>•</span>
                  <span class="text-amber-400 font-semibold">+50 XP</span>
                </div>
              </div>
            </button>
          `;
        });

        html += `
            </div>
          </section>
        `;
      });

      html += `</div></div>`;
      container.innerHTML = html;
    }

    // =========================================================================
    // 7. PLAYER DE AULA INTERATIVO EM 4 ETAPAS
    // =========================================================================
    let currentLessonPlayer = {
      lesson: null,
      step: 1, // 1: Conceito, 2: Regra de Ouro, 3: Desafio Relâmpago, 4: Conclusão
      quizAnswers: [null, null], // selected index for Q0 and Q1
      xpAwardedThisSession: 0
    };

    function openLesson(lessonId) {
      const all = getAllLessonsFlat();
      const found = all.find((l) => l.id === lessonId);
      if (!found) return;

      currentLessonPlayer = {
        lesson: found,
        step: 1,
        quizAnswers: [null, null],
        xpAwardedThisSession: 0
      };

      document.getElementById('lesson-modal').classList.remove('hidden');
      renderLessonStep();
    }

    function closeLessonModal() {
      document.getElementById('lesson-modal').classList.add('hidden');
      currentLessonPlayer.lesson = null;
      if (state.activeMainTab === 'trail') {
        renderTrailView(document.getElementById('app-main'));
      }
    }

    function renderLessonStep() {
      const { lesson, step, quizAnswers } = currentLessonPlayer;
      if (!lesson) return;

      const stepTitles = {
        1: 'Etapa 1 de 4 • Conceito em 30s',
        2: 'Etapa 2 de 4 • Regra de Ouro Visual',
        3: 'Etapa 3 de 4 • Desafio Relâmpago (2 Questões)',
        4: 'Etapa 4 de 4 • Missão Concluída!'
      };

      document.getElementById('lesson-step-label').textContent = stepTitles[step];
      document.getElementById('lesson-module-badge').textContent = `Módulo ${lesson.moduleNumber} (${lesson.moduleWeight})`;

      // Update 4-segment progress bar
      for (let i = 1; i <= 4; i++) {
        const bar = document.getElementById(`step-bar-${i}`);
        if (i < step) {
          bar.className = 'h-2 rounded-full bg-emerald-400 transition-all';
        } else if (i === step) {
          bar.className = 'h-2 rounded-full bg-amber-400 transition-all';
        } else {
          bar.className = 'h-2 rounded-full bg-[#334155] transition-all';
        }
      }

      const body = document.getElementById('lesson-modal-body');
      const footer = document.getElementById('lesson-modal-footer');

      if (step === 1) {
        // STEP 1: CONCEITO EM 30s
        body.innerHTML = `
          <div class="animate-fade-up space-y-5">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-2xl shrink-0">
                ${lesson.icon}
              </div>
              <div>
                <span class="text-xs font-mono font-bold text-cyan-400 uppercase">Resumo Direto ao Ponto</span>
                <h2 class="text-xl sm:text-2xl font-extrabold text-white">${lesson.title}</h2>
              </div>
            </div>

            <!-- Analogia Visual -->
            <div class="p-4 rounded-2xl bg-cyan-950/30 border border-cyan-500/40 flex items-start gap-3">
              <span class="text-2xl shrink-0">💡</span>
              <div>
                <div class="text-xs font-bold uppercase tracking-wider text-cyan-300 mb-1">Analogia para Nunca Esquecer</div>
                <p class="text-sm sm:text-base text-slate-100 leading-relaxed font-medium">${lesson.analogy}</p>
              </div>
            </div>

            <!-- Bullet Points Curtos -->
            <div class="space-y-2.5">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-400">O que você precisa saber em 30 segundos:</div>
              ${lesson.bullets
                .map(
                  (b) => `
                <div class="p-3.5 rounded-xl bg-[#0f172a] border border-[#334155] flex items-start gap-3">
                  <span class="text-amber-400 font-bold mt-0.5">▸</span>
                  <p class="text-sm sm:text-base text-slate-200 leading-snug">${b}</p>
                </div>
              `
                )
                .join('')}
            </div>
          </div>
        `;

        footer.innerHTML = `
          <button onclick="closeLessonModal()" class="px-4 py-2.5 rounded-xl bg-[#1e293b] hover:bg-slate-700 text-xs sm:text-sm font-semibold text-slate-300 transition">
            Sair
          </button>
          <button onclick="goToLessonStep(2)" class="px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-500/20 transition flex items-center gap-2">
            <span>Ver Regra de Ouro</span>
            <span>→</span>
          </button>
        `;
      } else if (step === 2) {
        // STEP 2: REGRA DE OURO / RESUMO VISUAL
        body.innerHTML = `
          <div class="animate-fade-up space-y-5">
            <div>
              <span class="text-xs font-mono font-bold text-amber-400 uppercase">Fixação Fotográfica</span>
              <h2 class="text-xl sm:text-2xl font-extrabold text-white">${lesson.goldenRuleTitle}</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${lesson.goldenRuleCards
                .map((card) => {
                  const borderMap = {
                    amber: 'border-amber-500/50 bg-amber-950/20',
                    cyan: 'border-cyan-500/50 bg-cyan-950/20',
                    emerald: 'border-emerald-500/50 bg-emerald-950/20',
                    rose: 'border-rose-500/50 bg-rose-950/20'
                  };
                  const badgeMap = {
                    amber: 'bg-amber-500/20 text-amber-300',
                    cyan: 'bg-cyan-500/20 text-cyan-300',
                    emerald: 'bg-emerald-500/20 text-emerald-300',
                    rose: 'bg-rose-500/20 text-rose-300'
                  };
                  return `
                    <div class="p-4 rounded-2xl border ${borderMap[card.color] || borderMap.cyan} space-y-3">
                      <span class="inline-block px-3 py-1 rounded-lg text-xs font-extrabold ${badgeMap[card.color] || badgeMap.cyan}">
                        ${card.badge}
                      </span>
                      <ul class="space-y-2">
                        ${card.points
                          .map(
                            (pt) => `
                          <li class="flex items-start gap-2 text-sm text-slate-200">
                            <span class="text-emerald-400 font-bold">✓</span>
                            <span>${pt}</span>
                          </li>
                        `
                          )
                          .join('')}
                      </ul>
                    </div>
                  `;
                })
                .join('')}
            </div>

            <!-- Mnemônico / Macete de Prova -->
            <div class="p-4 rounded-2xl bg-gradient-to-r from-amber-500/15 to-orange-500/10 border border-amber-500/40">
              <div class="text-xs font-extrabold uppercase tracking-wider text-amber-400 mb-1">🧠 Mnemônico & Macete de Prova</div>
              <p class="text-sm sm:text-base font-bold text-white">${lesson.mnemonic}</p>
            </div>
          </div>
        `;

        footer.innerHTML = `
          <button onclick="goToLessonStep(1)" class="px-4 py-2.5 rounded-xl bg-[#1e293b] hover:bg-slate-700 text-xs sm:text-sm font-semibold text-slate-300 transition">
            ← Voltar
          </button>
          <button onclick="goToLessonStep(3)" class="px-6 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-cyan-500/20 transition flex items-center gap-2">
            <span>Desafio Relâmpago (2 Questões)</span>
            <span>⚡</span>
          </button>
        `;
      } else if (step === 3) {
        // STEP 3: DESAFIO RELÂMPAGO (2 MINI-QUESTÕES)
        const bothAnswered = quizAnswers[0] !== null && quizAnswers[1] !== null;

        body.innerHTML = `
          <div class="animate-fade-up space-y-6">
            <div>
              <span class="text-xs font-mono font-bold text-emerald-400 uppercase">Prática Ativa</span>
              <h2 class="text-xl font-extrabold text-white">Desafio Relâmpago • Teste o que acabou de ver</h2>
            </div>

            ${lesson.quiz
              .map((qItem, qIdx) => {
                const chosen = quizAnswers[qIdx];
                const isAnswered = chosen !== null;
                return `
                  <div class="p-4 sm:p-5 rounded-2xl bg-[#0f172a] border border-[#334155] space-y-3">
                    <div class="flex items-center gap-2">
                      <span class="px-2 py-0.5 rounded-md bg-slate-800 text-amber-400 font-mono text-xs font-bold">
                        Questão ${qIdx + 1}/2
                      </span>
                    </div>
                    <p class="text-sm sm:text-base font-bold text-white leading-snug">${qItem.question}</p>

                    <div class="space-y-2">
                      ${qItem.options
                        .map((opt, oIdx) => {
                          let optStyle =
                            'bg-[#1e293b] border-[#334155] text-slate-200 hover:border-cyan-400 hover:bg-slate-800 cursor-pointer';
                          let badge = String.fromCharCode(65 + oIdx);

                          if (isAnswered) {
                            if (oIdx === qItem.correct) {
                              optStyle = 'bg-emerald-950/50 border-emerald-500 text-emerald-200 font-bold';
                              badge = '✓';
                            } else if (oIdx === chosen) {
                              optStyle = 'bg-rose-950/50 border-rose-500 text-rose-200';
                              badge = '✕';
                            } else {
                              optStyle = 'bg-[#1e293b]/40 border-[#334155]/50 text-slate-500';
                            }
                          }

                          return `
                            <button ${isAnswered ? 'disabled' : ''} onclick="answerLessonQuiz(${qIdx}, ${oIdx})" class="w-full text-left p-3 rounded-xl border ${optStyle} transition flex items-center gap-3 text-xs sm:text-sm">
                              <span class="w-7 h-7 rounded-lg bg-slate-900/80 border border-slate-700 flex items-center justify-center font-mono font-bold text-xs shrink-0">
                                ${badge}
                              </span>
                              <span>${opt}</span>
                            </button>
                          `;
                        })
                        .join('')}
                    </div>

                    ${
                      isAnswered
                        ? `
                      <div class="p-3 rounded-xl ${
                        chosen === qItem.correct
                          ? 'bg-emerald-500/15 border border-emerald-500/40 text-emerald-200'
                          : 'bg-amber-500/15 border border-amber-500/40 text-amber-200'
                      } text-xs sm:text-sm animate-fade-up">
                        <span class="font-extrabold">${chosen === qItem.correct ? '🎉 Mandou bem!' : '💡 Atenção ao detalhe:'}</span>
                        ${qItem.explanation}
                      </div>
                    `
                        : ''
                    }
                  </div>
                `;
              })
              .join('')}
          </div>
        `;

        footer.innerHTML = `
          <button onclick="goToLessonStep(2)" class="px-4 py-2.5 rounded-xl bg-[#1e293b] hover:bg-slate-700 text-xs sm:text-sm font-semibold text-slate-300 transition">
            ← Revisar Regra
          </button>
          <button ${bothAnswered ? '' : 'disabled'} onclick="completeLessonStep()" class="px-6 py-3 rounded-xl ${
          bothAnswered
            ? 'bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 shadow-lg shadow-emerald-500/25 cursor-pointer'
            : 'bg-slate-700 text-slate-400 cursor-not-allowed'
        } font-extrabold text-sm transition flex items-center gap-2">
            <span>${bothAnswered ? 'Concluir Aula (+50 XP)' : 'Responda as 2 questões'}</span>
            <span>🏆</span>
          </button>
        `;
      } else if (step === 4) {
        // STEP 4: CONCLUSÃO & RECOMPENSA
        const all = getAllLessonsFlat();
        const currIndex = all.findIndex((l) => l.id === lesson.id);
        const nextLesson = currIndex >= 0 && currIndex < all.length - 1 ? all[currIndex + 1] : null;
        const correctInQuiz =
          (quizAnswers[0] === lesson.quiz[0].correct ? 1 : 0) + (quizAnswers[1] === lesson.quiz[1].correct ? 1 : 0);

        body.innerHTML = `
          <div class="animate-fade-up text-center py-4 space-y-5">
            <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-4xl shadow-xl shadow-emerald-500/30">
              🏆
            </div>

            <div>
              <span class="px-3 py-1 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 font-mono font-extrabold text-xs">
                +${currentLessonPlayer.xpAwardedThisSession} XP CONQUISTADOS!
              </span>
              <h2 class="text-2xl sm:text-3xl font-black text-white mt-3">Aula Concluída!</h2>
              <p class="text-sm text-slate-300 mt-1">
                Você dominou <span class="text-amber-300 font-bold">${lesson.title}</span> e acertou <span class="text-emerald-400 font-bold">${correctInQuiz}/2</span> no desafio relâmpago.
              </p>
            </div>

            <div class="max-w-md mx-auto p-4 rounded-2xl bg-[#0f172a] border border-[#334155] text-left">
              <div class="text-xs font-bold uppercase text-cyan-400 mb-1">📌 Resumo para levar para a prova:</div>
              <p class="text-xs sm:text-sm text-slate-200 font-medium">${lesson.mnemonic}</p>
            </div>
          </div>
        `;

        footer.innerHTML = `
          <button onclick="closeLessonModal()" class="px-4 py-2.5 rounded-xl bg-[#1e293b] hover:bg-slate-700 text-xs sm:text-sm font-semibold text-slate-300 transition">
            Voltar para Trilha
          </button>
          ${
            nextLesson
              ? `
            <button onclick="openLesson('${nextLesson.id}')" class="px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-500/25 transition flex items-center gap-2">
              <span>Próxima Aula: ${nextLesson.title}</span>
              <span>→</span>
            </button>
          `
              : `
            <button onclick="closeLessonModal(); switchMainTab('exam');" class="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-extrabold text-sm shadow-lg transition">
              Ir para Simulado Express 🎯
            </button>
          `
          }
        `;
      }
    }

    function goToLessonStep(stepNum) {
      currentLessonPlayer.step = stepNum;
      renderLessonStep();
    }

    function answerLessonQuiz(qIdx, optionIdx) {
      if (currentLessonPlayer.quizAnswers[qIdx] !== null) return;
      currentLessonPlayer.quizAnswers[qIdx] = optionIdx;
      const isCorrect = optionIdx === currentLessonPlayer.lesson.quiz[qIdx].correct;
      playSound(isCorrect ? 'correct' : 'wrong');
      renderLessonStep();
    }

    function completeLessonStep() {
      const lessonId = currentLessonPlayer.lesson.id;
      const alreadyDone = state.completedLessons.includes(lessonId);

      if (!alreadyDone) {
        state.completedLessons.push(lessonId);
        currentLessonPlayer.xpAwardedThisSession = 50;
        addXP(50, 'Aula concluída!');
      } else {
        currentLessonPlayer.xpAwardedThisSession = 15;
        addXP(15, 'Revisão concluída!');
      }

      playSound('levelup');
      triggerConfettiBurst();
      currentLessonPlayer.step = 4;
      renderLessonStep();
    }

    // =========================================================================
    // 8. ABA 2: COLA RÁPIDA & FLASHCARDS (MEMORIZAÇÃO ACELERADA)
    // =========================================================================
    let flashcardUI = {
      domainFilter: 'Todos',
      currentIndex: 0,
      isFlipped: false
    };

    let radarUI = {
      searchQuery: '',
      categoryFilter: 'Todos'
    };

    function switchCramSubTab(subTab) {
      state.activeCramSubTab = subTab;
      saveState();
      renderCramView(document.getElementById('app-main'));
    }

    function renderCramView(container) {
      const sub = state.activeCramSubTab;
      const masteredCount = state.masteredFlashcards.length;

      let html = `
        <div class="animate-fade-up space-y-6">
          <!-- Sub-Tabs Navigation -->
          <div class="bg-[#1e293b] border border-[#334155] rounded-2xl p-2 grid grid-cols-1 sm:grid-cols-3 gap-2 shadow-md">
            <button onclick="switchCramSubTab('flashcards')" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 ${
              sub === 'flashcards'
                ? 'bg-cyan-500/20 border border-cyan-500 text-cyan-300'
                : 'text-slate-400 hover:text-white hover:bg-slate-800'
            }">
              <span>🃏 Flashcards 3D</span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-mono bg-slate-900 text-emerald-400">${masteredCount}/${FLASHCARDS.length}</span>
            </button>

            <button onclick="switchCramSubTab('radar')" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 ${
              sub === 'radar'
                ? 'bg-amber-500/20 border border-amber-500 text-amber-300'
                : 'text-slate-400 hover:text-white hover:bg-slate-800'
            }">
              <span>📡 Radar de Palavras-Chave</span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-mono bg-slate-900 text-amber-300">${KEYWORD_RADAR.length}</span>
            </button>

            <button onclick="switchCramSubTab('battles')" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 ${
              sub === 'battles'
                ? 'bg-emerald-500/20 border border-emerald-500 text-emerald-300'
                : 'text-slate-400 hover:text-white hover:bg-slate-800'
            }">
              <span>⚔️ Batalha de Conceitos</span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-mono bg-slate-900 text-emerald-300">X vs Y</span>
            </button>
          </div>

          <div id="cram-subview-content"></div>
        </div>
      `;

      container.innerHTML = html;
      const subContainer = document.getElementById('cram-subview-content');

      if (sub === 'flashcards') {
        renderFlashcardsSubView(subContainer);
      } else if (sub === 'radar') {
        renderRadarSubView(subContainer);
      } else if (sub === 'battles') {
        renderBattlesSubView(subContainer);
      }
    }

    // --- Sub-aba 1: Flashcards 3D Interativos ---
    function getFilteredFlashcards() {
      if (flashcardUI.domainFilter === 'Todos') return FLASHCARDS;
      return FLASHCARDS.filter((f) => f.domain === flashcardUI.domainFilter);
    }

    function setFlashcardFilter(domain) {
      flashcardUI.domainFilter = domain;
      flashcardUI.currentIndex = 0;
      flashcardUI.isFlipped = false;
      renderFlashcardsSubView(document.getElementById('cram-subview-content'));
    }

    function flipFlashcard() {
      flashcardUI.isFlipped = !flashcardUI.isFlipped;
      playSound('flip');
      const inner = document.getElementById('flashcard-3d-inner');
      if (inner) {
        if (flashcardUI.isFlipped) {
          inner.classList.add('rotate-y-180');
        } else {
          inner.classList.remove('rotate-y-180');
        }
      }
    }

    function navigateFlashcard(delta) {
      const deck = getFilteredFlashcards();
      if (deck.length === 0) return;
      flashcardUI.currentIndex = (flashcardUI.currentIndex + delta + deck.length) % deck.length;
      flashcardUI.isFlipped = false;
      renderFlashcardsSubView(document.getElementById('cram-subview-content'));
    }

    function toggleMasterFlashcard(cardId) {
      const idx = state.masteredFlashcards.indexOf(cardId);
      if (idx === -1) {
        state.masteredFlashcards.push(cardId);
        addXP(15, 'Flashcard dominado!');
        playSound('correct');
      } else {
        state.masteredFlashcards.splice(idx, 1);
        saveState();
      }
      renderCramView(document.getElementById('app-main'));
    }

    function renderFlashcardsSubView(container) {
      const domains = ['Todos', 'Conceitos', 'Segurança', 'Tecnologia', 'Cobrança'];
      const deck = getFilteredFlashcards();
      if (flashcardUI.currentIndex >= deck.length) flashcardUI.currentIndex = 0;
      const card = deck[flashcardUI.currentIndex];
      const isMastered = state.masteredFlashcards.includes(card.id);

      container.innerHTML = `
        <div class="space-y-5 max-w-3xl mx-auto">
          <!-- Domain Filter Pills -->
          <div class="flex flex-wrap items-center justify-center gap-2">
            ${domains
              .map(
                (d) => `
              <button onclick="setFlashcardFilter('${d}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold border transition ${
                  flashcardUI.domainFilter === d
                    ? 'bg-cyan-500 text-slate-950 border-cyan-400'
                    : 'bg-[#1e293b] text-slate-300 border-[#334155] hover:border-slate-500'
                }">
                ${d}
              </button>
            `
              )
              .join('')}
          </div>

          <!-- Deck Counter -->
          <div class="flex items-center justify-between text-xs text-slate-400 px-1">
            <span>Card <strong class="text-white">${flashcardUI.currentIndex + 1}</strong> de <strong class="text-white">${deck.length}</strong></span>
            <span>Clique no card para virar 🔄</span>
          </div>

          <!-- 3D Flip Card -->
          <div onclick="flipFlashcard()" class="perspective-1000 w-full h-80 sm:h-72 cursor-pointer select-none">
            <div id="flashcard-3d-inner" class="relative w-full h-full transform-style-3d ${flashcardUI.isFlipped ? 'rotate-y-180' : ''}">

    // =========================================================================
    // 9. ABA 3: SIMULADO EXPRESS (TREINO & PROVA + ESCALA AWS 100-1000)
    // =========================================================================
    let examConfig = {
      mode: 'treino', // 'treino' | 'prova'
      size: 10        // 10 | 25
    };

    let examState = {
      active: false,
      finished: false,
      mode: 'treino',
      questions: [],
      userAnswers: {}, // { questionIndex: optionIndex }
      currentIndex: 0,
      secondsRemaining: 0,
      timerInterval: null,
      reviewFilter: 'all' // 'all' | 'wrong' | 'correct'
    };

    function setExamMode(mode) {
      examConfig.mode = mode;
      renderExamView(document.getElementById('app-main'));
    }

    function setExamSize(size) {
      examConfig.size = size;
      renderExamView(document.getElementById('app-main'));
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildBalancedExamDeck(count) {
      if (count >= EXAM_QUESTIONS.length) {
        return shuffleArray(EXAM_QUESTIONS);
      }
      // Proportionally sample across the 4 domains
      const byDomain = {
        Conceitos: shuffleArray(EXAM_QUESTIONS.filter((q) => q.domain === 'Conceitos')),
        Segurança: shuffleArray(EXAM_QUESTIONS.filter((q) => q.domain === 'Segurança')),
        Tecnologia: shuffleArray(EXAM_QUESTIONS.filter((q) => q.domain === 'Tecnologia')),
        Cobrança: shuffleArray(EXAM_QUESTIONS.filter((q) => q.domain === 'Cobrança'))
      };

      if (count === 10) {
        const picked = [
          ...byDomain.Conceitos.slice(0, 2),
          ...byDomain.Segurança.slice(0, 3),
          ...byDomain.Tecnologia.slice(0, 4),
          ...byDomain.Cobrança.slice(0, 1)
        ];
        return shuffleArray(picked);
      }

      // 25 questions balanced (~24%, 30%, 34%, 12%)
      const picked25 = [
        ...byDomain.Conceitos.slice(0, 6),
        ...byDomain.Segurança.slice(0, 7),
        ...byDomain.Tecnologia.slice(0, 9),
        ...byDomain.Cobrança.slice(0, 3)
      ];
      return shuffleArray(picked25);
    }

    function startExam(customQuestions = null, forcedMode = null) {
      if (examState.timerInterval) {
        clearInterval(examState.timerInterval);
        examState.timerInterval = null;
      }

      const mode = forcedMode || examConfig.mode;
      const deck = customQuestions ? shuffleArray(customQuestions) : buildBalancedExamDeck(examConfig.size);
      const durationSeconds = deck.length <= 10 ? 15 * 60 : 35 * 60;

      examState = {
        active: true,
        finished: false,
        mode,
        questions: deck,
        userAnswers: {},
        currentIndex: 0,
        secondsRemaining: durationSeconds,
        timerInterval: null,
        reviewFilter: 'all'
      };

      if (mode === 'prova') {
        examState.timerInterval = setInterval(() => {
          examState.secondsRemaining--;
          const timerEl = document.getElementById('exam-timer-display');
          if (timerEl) {
            timerEl.textContent = formatTime(examState.secondsRemaining);
            if (examState.secondsRemaining <= 60) {
              timerEl.classList.add('text-rose-400', 'animate-pulse');
            }
          }
          if (examState.secondsRemaining <= 0) {
            finishExam();
          }
        }, 1000);
      }

      renderExamView(document.getElementById('app-main'));
    }

    function retryWrongQuestions(questionIds) {
      const subset = EXAM_QUESTIONS.filter((q) => questionIds.includes(q.id));
      if (subset.length === 0) return;
      startExam(subset, 'treino');
      showToast(`🎯 Revisando ${subset.length} questão(ões) errada(s)!`, 'amber');
    }

    function formatTime(sec) {
      const s = Math.max(0, sec);
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function selectExamAnswer(optionIdx) {
      const idx = examState.currentIndex;
      // In Treino mode, lock once answered so feedback is immediate and clear
      if (examState.mode === 'treino' && examState.userAnswers[idx] !== undefined) return;

      examState.userAnswers[idx] = optionIdx;

      if (examState.mode === 'treino') {
        const isCorrect = optionIdx === examState.questions[idx].correct;
        playSound(isCorrect ? 'correct' : 'wrong');
      } else {
        playSound('flip');
      }

      renderExamView(document.getElementById('app-main'));
    }

    function goToExamQuestion(index) {
      if (index < 0 || index >= examState.questions.length) return;
      examState.currentIndex = index;
      renderExamView(document.getElementById('app-main'));
    }

    function requestFinishExam() {
      const answeredCount = Object.keys(examState.userAnswers).length;
      const total = examState.questions.length;

      if (answeredCount < total) {
        openConfirmModal(
          'Finalizar Simulado Agora?',
          `Você respondeu ${answeredCount} de ${total} questões. As questões em branco serão contabilizadas como erradas.`,
          'Finalizar e Ver Nota',
          () => finishExam()
        );
      } else {
        finishExam();
      }
    }

    function finishExam() {
      if (examState.timerInterval) {
        clearInterval(examState.timerInterval);
        examState.timerInterval = null;
      }

      examState.active = false;
      examState.finished = true;

      // Calculate score on AWS Scale (100 to 1000, passing 700)
      let correctCount = 0;
      const domainStats = {
        Conceitos: { correct: 0, total: 0, weight: '24%' },
        Segurança: { correct: 0, total: 0, weight: '30%' },
        Tecnologia: { correct: 0, total: 0, weight: '34%' },
        Cobrança: { correct: 0, total: 0, weight: '12%' }
      };
      const missedIds = [];

      examState.questions.forEach((q, idx) => {
        const chosen = examState.userAnswers[idx];
        const isRight = chosen === q.correct;
        if (domainStats[q.domain]) {
          domainStats[q.domain].total++;
          if (isRight) domainStats[q.domain].correct++;
        }
        if (isRight) {
          correctCount++;
        } else {
          missedIds.push(q.id);
        }
      });

      const total = examState.questions.length;
      const ratio = total > 0 ? correctCount / total : 0;
      const scaledScore = Math.round(100 + ratio * 900);
      const passed = scaledScore >= 700;

      // XP reward proportional to correct answers
      const xpEarned = Math.max(10, correctCount * 10);
      addXP(xpEarned, `Simulado finalizado (${scaledScore} pts)`);

      if (passed) {
        playSound('levelup');
        triggerConfettiBurst();
      }

      state.lastExamResult = {
        scaledScore,
        correctCount,
        totalCount: total,
        passed
      };
      state.wrongQuestionIds = missedIds;
      saveState();

      renderExamView(document.getElementById('app-main'));
    }

    function resetExamToLobby() {
      if (examState.timerInterval) {
        clearInterval(examState.timerInterval);
        examState.timerInterval = null;
      }
      examState.active = false;
      examState.finished = false;
      renderExamView(document.getElementById('app-main'));
    }

    function setExamReviewFilter(filter) {
      examState.reviewFilter = filter;
      renderExamView(document.getElementById('app-main'));
    }

    function renderExamView(container) {
      // VIEW A: ACTIVE EXAM / QUIZ
      if (examState.active) {
        const idx = examState.currentIndex;
        const total = examState.questions.length;
        const q = examState.questions[idx];
        const chosen = examState.userAnswers[idx];

        const isTreino = examState.mode === 'treino';

        container.innerHTML = `
          <div class="animate-fade-up max-w-4xl mx-auto space-y-5">

            <div class="bg-[#1e293b] border border-[#334155] rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-md">
              <div class="flex items-center gap-3">
                <span class="px-3 py-1 rounded-lg font-mono text-xs font-extrabold ${
                  isTreino
                    ? 'bg-cyan-500/20 border border-cyan-500/40 text-cyan-300'
                    : 'bg-amber-500/20 border border-amber-500/40 text-amber-300'
                }">
                  ${isTreino ? '🎯 MODO TREINO' : '⏱️ MODO PROVA'}
                </span>
                <span class="text-sm font-bold text-white">
                  Questão <span class="text-amber-400">${idx + 1}</span> de ${total}
                </span>
                ${
                  isTreino
                    ? `<span class="hidden sm:inline-block px-2.5 py-0.5 rounded-md bg-[#0f172a] text-xs text-slate-400 border border-[#334155]">${q.domain}</span>`
                    : ''
                }
              </div>

              <div class="flex items-center gap-3">
                ${
                  !isTreino
                    ? `
                  <div class="px-3 py-1.5 rounded-xl bg-[#0f172a] border border-[#334155] font-mono text-sm font-bold text-amber-300 flex items-center gap-1.5">
                    <span>⏳</span>
                    <span id="exam-timer-display">${formatTime(examState.secondsRemaining)}</span>
                  </div>
                `
                    : ''
                }
                <button onclick="requestFinishExam()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs sm:text-sm font-extrabold text-white transition shadow-md">
                  Finalizar
                </button>
              </div>
            </div>

            <!-- Question Navigation Strip -->
            <div class="bg-[#1e293b]/70 border border-[#334155] rounded-2xl p-3 flex flex-wrap gap-1.5 justify-center">
              ${examState.questions
                .map((item, qI) => {
                  const ans = examState.userAnswers[qI];
                  let pillClass = 'bg-[#0f172a] border-[#334155] text-slate-400 hover:border-slate-500';
                  if (qI === idx) {
                    pillClass = 'bg-amber-500 text-slate-950 border-amber-400 font-black scale-105';

                    if (isTreino) {
                      pillClass =
                        ans === item.correct

                          : 'bg-rose-500/25 border-rose-500 text-rose-300 font-bold';
                    } else {
                      pillClass = 'bg-cyan-500/25 border-cyan-500 text-cyan-300 font-bold';
                    }
                  }
                  return `
                    <button onclick="goToExamQuestion(${qI})" class="w-8 h-8 rounded-lg border text-xs font-mono transition ${pillClass}">
                      ${qI + 1}
                    </button>
                  `;
                })
                .join('')}
            </div>

            <!-- Question Card -->
            <div class="bg-[#1e293b] border border-[#334155] rounded-2xl p-5 sm:p-8 shadow-xl space-y-5">
              <p class="text-base sm:text-xl font-bold text-white leading-relaxed">
                ${q.question}
              </p>

              <div class="space-y-3">
                ${q.options
                  .map((opt, oIdx) => {
                    const letter = String.fromCharCode(65 + oIdx);
                    let btnStyle =
                      'bg-[#0f172a] border-[#334155] text-slate-200 hover:border-amber-400 hover:bg-slate-900 cursor-pointer';
                    let badgeStyle = 'bg-[#1e293b] border-[#334155] text-slate-300';

                    if (isTreino && isAnswered) {
                      if (oIdx === q.correct) {
                        btnStyle = 'bg-emerald-950/50 border-emerald-500 text-emerald-100 font-bold';
                        badgeStyle = 'bg-emerald-500 text-slate-950 border-emerald-400';
                      } else if (oIdx === chosen) {
                        btnStyle = 'bg-rose-950/50 border-rose-500 text-rose-200';
                        badgeStyle = 'bg-rose-500 text-white border-rose-400';
                      } else {

                } text-xs sm:text-sm leading-relaxed animate-fade-up">
                  <span class="font-extrabold block mb-1">${
                    chosen === q.correct ? '✅ Resposta Correta!' : `❌ Resposta Correta: Alternativa ${String.fromCharCode(65 + q.correct)}`
                  }</span>
                  ${q.explanation}
                </div>
              `
                  : ''
              }
            </div>

            <!-- Bottom Navigation & Keyboard Shortcut Hint -->
            <div class="flex flex-wrap items-center justify-between gap-3">
              <button ${idx === 0 ? 'disabled' : ''} onclick="goToExamQuestion(${idx - 1})" class="px-5 py-3 rounded-xl bg-[#1e293b] hover:bg-slate-700 disabled:opacity-40 border border-[#334155] text-sm font-bold text-slate-200 transition">
                ← Anterior
              </button>

              <span class="hidden sm:inline text-xs text-slate-500 font-mono">
                Atalhos: [A-D] Responder • [Enter] Avançar
              </span>

              ${
                idx < total - 1
                  ? `
                <button onclick="goToExamQuestion(${idx + 1})" class="px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-500/20 transition">
                  Próxima Questão →
                </button>
              `
                  : `
                <button onclick="requestFinishExam()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-emerald-500/25 transition">
                  Concluir Simulado 🏆
                </button>
              `
              }
            </div>
          </div>
        `;
        return;
      }

      // VIEW B: FINAL EXAM SCORE & DOMAIN ANALYTICS
      if (examState.finished) {
        let correctCount = 0;
        const domainStats = {
          Conceitos: { correct: 0, total: 0, weight: '24%' },
          Segurança: { correct: 0, total: 0, weight: '30%' },
          Tecnologia: { correct: 0, total: 0, weight: '34%' },
          Cobrança: { correct: 0, total: 0, weight: '12%' }
        };
        const missedIds = [];

        examState.questions.forEach((q, idx) => {
          const chosen = examState.userAnswers[idx];
          const isRight = chosen === q.correct;
          if (domainStats[q.domain]) {
            domainStats[q.domain].total++;
            if (isRight) domainStats[q.domain].correct++;
          }
          if (isRight) {
            correctCount++;
          } else {
            missedIds.push(q.id);
          }
        });

        const total = examState.questions.length;
        const scaledScore = Math.round(100 + (correctCount / total) * 900);
        const passed = scaledScore >= 700;

        const reviewList = examState.questions
          .map((q, idx) => ({ q, idx, chosen: examState.userAnswers[idx], isRight: examState.userAnswers[idx] === q.correct }))
          .filter((item) => {
            if (examState.reviewFilter === 'wrong') return !item.isRight;
            if (examState.reviewFilter === 'correct') return item.isRight;
            return true;
          });

        container.innerHTML = `
          <div class="animate-fade-up max-w-4xl mx-auto space-y-6">
            <!-- Score Hero Card -->
            <div class="bg-gradient-to-br from-[#1e293b] to-slate-900 border-2 ${
              passed ? 'border-emerald-500/70' : 'border-amber-500/70'
            } rounded-3xl p-6 sm:p-8 text-center shadow-2xl space-y-4">
              <span class="inline-block px-4 py-1 rounded-full text-xs font-mono font-extrabold ${
                passed
                  ? 'bg-emerald-500/20 border border-emerald-500/50 text-emerald-300'
                  : 'bg-amber-500/20 border border-amber-500/50 text-amber-300'
              }">
                ${passed ? '🎉 APROVADO NA SIMULAÇÃO (CORTE: 700)' : '💪 QUASE LÁ! CORTE OFICIAL AWS: 700'}
              </span>

              <div>
                <div class="text-xs uppercase tracking-widest text-slate-400 font-bold">Pontuação Estimada (Escala AWS 100 – 1000)</div>
                <div class="text-5xl sm:text-6xl font-black font-mono mt-1 ${passed ? 'text-emerald-400' : 'text-amber-400'}">
                  ${scaledScore}
                </div>
                <p class="text-sm text-slate-300 mt-2">
                  Você acertou <strong class="text-white">${correctCount} de ${total}</strong> questões (${Math.round((correctCount / total) * 100)}%).
                </p>
              </div>

              <!-- Action Buttons -->
              <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
                ${
                  missedIds.length > 0
                    ? `
                  <button onclick='retryWrongQuestions(${JSON.stringify(missedIds)})' class="px-5 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-amber-500/25 transition">
                    🔁 Refazer apenas as questões que errei (${missedIds.length})
                  </button>
                `
                    : ''
                }
                <button onclick="resetExamToLobby()" class="px-5 py-3 rounded-xl bg-[#0f172a] hover:bg-slate-800 border border-[#334155] text-sm font-bold text-slate-200 transition">
                  Novo Simulado
                </button>
              </div>
            </div>

            <!-- Domain Performance Bar Chart -->
            <div class="bg-[#1e293b] border border-[#334155] rounded-2xl p-5 sm:p-6 space-y-4">
              <h3 class="text-base sm:text-lg font-extrabold text-white">📊 Desempenho por Domínio Oficial</h3>
              <div class="space-y-3.5">
                ${Object.entries(domainStats)
                  .filter(([, st]) => st.total > 0)
                  .map(([domName, st]) => {
                    const pct = Math.round((st.correct / st.total) * 100);
                    const barColor = pct >= 70 ? 'bg-emerald-400' : pct >= 50 ? 'bg-amber-400' : 'bg-rose-400';
                    return `
                      <div class="space-y-1">
                        <div class="flex items-center justify-between text-xs sm:text-sm">
                          <span class="font-bold text-slate-200">${domName} <span class="text-slate-500 font-mono text-xs">(Peso ${st.weight})</span></span>
                          <span class="font-mono font-bold ${pct >= 70 ? 'text-emerald-400' : 'text-amber-300'}">${st.correct}/${st.total} (${pct}%)</span>
                        </div>
                        <div class="h-3 bg-[#0f172a] rounded-full overflow-hidden border border-[#334155]">
                          <div class="h-full ${barColor} rounded-full transition-all duration-700" style="width: ${pct}%"></div>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>

            <!-- Detailed Question-by-Question Review -->
            <div class="space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h3 class="text-base sm:text-lg font-extrabold text-white">📝 Revisão das Questões</h3>
                <div class="flex gap-1.5">
                  <button onclick="setExamReviewFilter('all')" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${
                    examState.reviewFilter === 'all' ? 'bg-cyan-500 text-slate-950 border-cyan-400' : 'bg-[#1e293b] text-slate-300 border-[#334155]'
                  }">Todas (${total})</button>
                  <button onclick="setExamReviewFilter('wrong')" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${
                    examState.reviewFilter === 'wrong' ? 'bg-rose-500 text-white border-rose-400' : 'bg-[#1e293b] text-slate-300 border-[#334155]'
                  }">Erradas (${missedIds.length})</button>
                  <button onclick="setExamReviewFilter('correct')" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${
                    examState.reviewFilter === 'correct' ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-[#1e293b] text-slate-300 border-[#334155]'
                  }">Corretas (${correctCount})</button>
                </div>
              </div>

              <div class="space-y-3">
                ${reviewList
                  .map(
                    ({ q, idx, chosen, isRight }) => `
                  <div class="p-4 sm:p-5 rounded-2xl bg-[#1e293b] border ${
                    isRight ? 'border-emerald-500/40' : 'border-rose-500/40'
                  } space-y-2.5">
                    <div class="flex items-center justify-between gap-2">
                      <span class="text-xs font-mono font-bold ${isRight ? 'text-emerald-400' : 'text-rose-400'}">
                        ${isRight ? '✓ ACERTOU' : '✕ ERROU'} • Questão ${idx + 1} (${q.domain})
                      </span>
                    </div>
                    <p class="text-sm sm:text-base font-bold text-white">${q.question}</p>
                    <div class="text-xs sm:text-sm space-y-1">
                      <div class="${isRight ? 'text-emerald-300' : 'text-rose-300'}">
                        <strong>Sua resposta:</strong> ${chosen !== undefined ? q.options[chosen] : 'Em branco'}
                      </div>
                      ${
                        !isRight
                          ? `<div class="text-emerald-300"><strong>Correta:</strong> ${q.options[q.correct]}</div>`
                          : ''
                      }
                    </div>
                    <div class="p-3 rounded-xl bg-[#0f172a] border border-[#334155] text-xs text-slate-300">
                      💡 <strong>Macete:</strong> ${q.explanation}
                    </div>
                  </div>
                `
                  )
                  .join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      // VIEW C: EXAM LOBBY / SETUP SCREEN
      const savedWrongs = state.wrongQuestionIds || [];

      container.innerHTML = `
        <div class="animate-fade-up max-w-3xl mx-auto space-y-6">
          <div class="bg-[#1e293b] border border-[#334155] rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
            <div class="space-y-1.5">
              <span class="px-3 py-1 rounded-full bg-amber-500/15 border border-amber-500/40 text-amber-300 font-mono text-xs font-bold">
                SIMULADO EXPRESS • ESTILO OFICIAL CLF-C02
              </span>
              <h2 class="text-2xl sm:text-3xl font-black text-white">Pronto para testar seus reflexos?</h2>
              <p class="text-sm text-slate-400">
                Questões situacionais inéditas nos 4 domínios oficiais com pontuação na escala AWS (100 a 1000, corte 700).
              </p>
            </div>

            <!-- Step 1: Choose Mode -->
            <div class="space-y-2.5">
              <label class="text-xs font-extrabold uppercase tracking-wider text-slate-400">1. Escolha o Modo</label>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="setExamMode('treino')" class="p-4 rounded-2xl border-2 text-left transition ${
                  examConfig.mode === 'treino'
                    ? 'bg-cyan-950/30 border-cyan-400 shadow-lg shadow-cyan-500/10'
                    : 'bg-[#0f172a] border-[#334155] hover:border-slate-500'
                }">
                  <div class="flex items-center justify-between mb-1">
                    <span class="font-extrabold text-base text-white">🎯 Modo Treino</span>
                    <span class="text-xs font-mono text-cyan-300 font-bold">Sem Relógio</span>
                  </div>
                  <p class="text-xs text-slate-400">Correção imediata e macete explicativo logo após responder cada questão.</p>
                </button>

                <button onclick="setExamMode('prova')" class="p-4 rounded-2xl border-2 text-left transition ${
                  examConfig.mode === 'prova'
                    ? 'bg-amber-950/30 border-amber-400 shadow-lg shadow-amber-500/10'
                    : 'bg-[#0f172a] border-[#334155] hover:border-slate-500'
                }">
                  <div class="flex items-center justify-between mb-1">
                    <span class="font-extrabold text-base text-white">⏱️ Modo Prova</span>
                    <span class="text-xs font-mono text-amber-300 font-bold">Cronometrado</span>
                  </div>
                  <p class="text-xs text-slate-400">Simula o exame real com contagem regressiva e gabarito revelado só no final.</p>
                </button>
              </div>
            </div>

            <!-- Step 2: Choose Size -->
            <div class="space-y-2.5">
              <label class="text-xs font-extrabold uppercase tracking-wider text-slate-400">2. Escolha o Tamanho</label>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="setExamSize(10)" class="p-4 rounded-2xl border-2 text-left transition ${
                  examConfig.size === 10
                    ? 'bg-emerald-950/30 border-emerald-400 shadow-lg shadow-emerald-500/10'
                    : 'bg-[#0f172a] border-[#334155] hover:border-slate-500'
                }">
                  <div class="flex items-center justify-between mb-1">
                    <span class="font-extrabold text-base text-white">⚡ 10 Questões Rápidas</span>
                    <span class="text-xs font-mono text-emerald-300 font-bold">15 min</span>
                  </div>
                  <p class="text-xs text-slate-400">Sprint rápido equilibrado nos 4 domínios para treino diário.</p>
                </button>

                <button onclick="setExamSize(25)" class="p-4 rounded-2xl border-2 text-left transition ${
                  examConfig.size === 25
                    ? 'bg-emerald-950/30 border-emerald-400 shadow-lg shadow-emerald-500/10'
                    : 'bg-[#0f172a] border-[#334155] hover:border-slate-500'
                }">
                  <div class="flex items-center justify-between mb-1">
                    <span class="font-extrabold text-base text-white">🏆 25 Questões Completas</span>
                    <span class="text-xs font-mono text-emerald-300 font-bold">35 min</span>
                  </div>
                  <p class="text-xs text-slate-400">Simulação aprofundada seguindo os pesos oficiais da certificação.</p>
                </button>
              </div>
            </div>

            <!-- Start CTA -->
            <div class="pt-2 flex flex-col sm:flex-row gap-3">
              <button onclick="startExam()" class="flex-1 py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black text-base shadow-xl shadow-amber-500/25 transition transform active:scale-98">
                Iniciar Simulado Express 🚀
              </button>

              ${
                savedWrongs.length > 0
                  ? `
                <button onclick='retryWrongQuestions(${JSON.stringify(savedWrongs)})' class="py-4 px-5 rounded-2xl bg-[#0f172a] hover:bg-slate-800 border border-rose-500/50 text-rose-300 font-bold text-xs sm:text-sm transition">
                  🔁 Revisar ${savedWrongs.length} Erro(s) Salvo(s)
                </button>
              `
                  : ''
              }
            </div>
          </div>

          ${
            state.lastExamResult
              ? `
            <div class="p-4 rounded-2xl bg-[#1e293b]/70 border border-[#334155] flex items-center justify-between text-xs sm:text-sm">
              <span class="text-slate-400">Última nota registrada:</span>
              <span class="font-mono font-extrabold ${state.lastExamResult.passed ? 'text-emerald-400' : 'text-amber-300'}">
                ${state.lastExamResult.scaledScore} pts (${state.lastExamResult.correctCount}/${state.lastExamResult.totalCount} acertos)
              </span>
            </div>
          `
              : ''
          }
        </div>
      `;
    }

    // =========================================================================
    // 10. ATALHOS DE TECLADO (A-D, ENTER, SETAS, ESC)
    // =========================================================================
    document.addEventListener('keydown', (e) => {
      // Close modals on Escape
      if (e.key === 'Escape') {
        if (!document.getElementById('confirm-modal').classList.contains('hidden')) {
          closeConfirmModal();
          return;
        }
        if (!document.getElementById('lesson-modal').classList.contains('hidden')) {
          closeLessonModal();
          return;
        }
      }

      // Keyboard shortcuts inside Active Exam
      if (state.activeMainTab === 'exam' && examState.active && document.getElementById('confirm-modal').classList.contains('hidden')) {
        const key = e.key.toUpperCase();
        if (key === 'A' || key === '1') selectExamAnswer(0);
        else if (key === 'B' || key === '2') selectExamAnswer(1);
        else if (key === 'C' || key === '3') selectExamAnswer(2);
        else if (key === 'D' || key === '4') selectExamAnswer(3);
        else if (e.key === 'Enter' || e.key === 'ArrowRight') {
          if (examState.currentIndex < examState.questions.length - 1) {
            goToExamQuestion(examState.currentIndex + 1);
          }
        } else if (e.key === 'ArrowLeft') {
          if (examState.currentIndex > 0) {
            goToExamQuestion(examState.currentIndex - 1);
          }
        }
      }
    });

    // =========================================================================
    // 11. INICIALIZAÇÃO
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      renderActiveMainTab();
    });
  </script>
</body>
</html>
